# The app developer's file: what the Notes app is (docs/PLATFORM-PLAN.md,
# section 5.1). It never names other apps or installation choices; those are
# in the operator's platform.yaml. The source is still in notes-backend/ and
# notes-frontend/ at the repository root; phase 5 moves it here.

name: notes
# The OAuth client its frontend logs in with (notes-frontend/keycloak-adapter.js).
keycloakClient: notes-frontend
# apiCollection is left out: the DR tools check the app by reading /api/notes,
# the name (see examples/todo/app.yaml).
# The images it builds (section 5.2), each localhost/notes-<name>; see
# examples/todo/app.yaml.
images:
  backend:
    context: ../..
    containerfile: notes-backend/Containerfile
  frontend:
    context: ../..
    containerfile: notes-frontend/Containerfile
