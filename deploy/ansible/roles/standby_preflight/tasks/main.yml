---
# Transport only: app_installer.preflight gathers this host's identity and
# database volumes and refuses an inventory the host does not match.
- name: Read the complete database group
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/read-replication-registry.yml"

- name: Read and validate this host's identity and database volumes
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - app_installer
      - node-facts
      - --inventory-hostname
      - "{{ inventory_hostname }}"
      - --role
      - "{{ todo_node_role }}"
      - --address
      - "{{ todo_node_address }}"
  environment:
    PYTHONPATH: >-
      {{ '/opt/todo/lib' if app_installer_fapolicyd.rc == 0
         else app_installer_target ~ '/deploy/installer' }}
    PYTHONDONTWRITEBYTECODE: "1"
  register: preflight_node_facts
  changed_when: false

# Only the primary publishes PostgreSQL on the LAN interface during bootstrap
# (app_installer publish-primaries bootstrap); the standby installs loopback-only.
# Require the operator's documented firewalld rule (STANDBY-BOOTSTRAP.md) before
# bootstrap opens those ports, instead of only relying on a manual step.
- name: Require an active firewall before this primary's databases go on the LAN
  when: todo_node_role == 'primary'
  become: true
  vars:
    preflight_standby_address: "{{ hostvars[groups['todo_standby'][0]].todo_node_address }}"
    preflight_replication_ports: "{{ todo_replication_metadata | map(attribute='replication_port') | list }}"
    preflight_port_range: "{{ preflight_replication_ports | min }}-{{ preflight_replication_ports | max }}"
    preflight_rich_rule: >-
      rule family="ipv4" source address="{{ preflight_standby_address }}/32"
      destination address="{{ todo_node_address }}" port port="{{ preflight_port_range }}"
      protocol="tcp" accept
  block:
    - name: Require active firewalld on the primary
      ansible.builtin.command:
        argv: [firewall-cmd, --state]
      register: preflight_firewalld_state
      changed_when: false
      failed_when: preflight_firewalld_state.rc != 0

    - name: Check for the documented rich rule permitting the standby's replication traffic
      ansible.builtin.command:
        argv: [firewall-cmd, --permanent, --zone=public, "--query-rich-rule={{ preflight_rich_rule }}"]
      register: preflight_firewalld_rich_rule
      changed_when: false
      failed_when: preflight_firewalld_rich_rule.rc not in [0, 1]

    - name: Require the rich rule to be present
      ansible.builtin.assert:
        that: preflight_firewalld_rich_rule.rc == 0
        fail_msg: >-
          No firewalld rich rule on this primary permits {{ preflight_standby_address }} to
          reach the PostgreSQL replication ports. Add it before bootstrap publishes
          them on the LAN interface, then reload:
          sudo firewall-cmd --permanent --zone=public --add-rich-rule='{{ preflight_rich_rule }}'
          && sudo firewall-cmd --reload
