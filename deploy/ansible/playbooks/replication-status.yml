---
- name: Verify replication on both initial database hosts
  hosts: todo_cluster
  # The shared trust role also updates exact controller file trust. Serialize it.
  serial: 1
  gather_facts: false
  any_errors_fatal: true
  vars:
    project_root: "{{ playbook_dir }}/../../.."
  tasks:
    - name: Select the complete database group
      ansible.builtin.include_tasks: ../tasks/replication-apps.yml

    - name: Check each database role and replication state
      ansible.builtin.include_tasks: ../tasks/replicate-workload.yml
      loop: "{{ apps_to_replicate }}"
      loop_control:
        loop_var: todo_replication_app
      vars:
        todo_replication_operation: "{{ 'streaming' if todo_node_role == 'primary' else 'status' }}"

    - name: Require read-only recovery on each standby
      ansible.builtin.include_tasks: ../tasks/require-standby.yml
      loop: "{{ apps_to_replicate }}"
      loop_control:
        loop_var: todo_replication_app
      when: todo_node_role == 'standby'
