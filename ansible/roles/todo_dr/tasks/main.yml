---
- name: Create the Todo DR configuration directory
  ansible.builtin.file:
    path: "{{ m13_config_directory }}"
    state: directory
    mode: "0700"

- name: Install the local Todo DR files through pipelined stdin
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - |
        set -eu
        target=$1
        mode=$2
        expected_mode=${mode#0}
        temporary=$(mktemp "${target}.XXXXXX")
        trap "rm -f \"$temporary\"" EXIT HUP INT TERM
        base64 --decode > "$temporary"
        chmod "$mode" "$temporary"
        if [ -f "$target" ] &&
           cmp --silent "$temporary" "$target" &&
           [ "$(stat --format=%a "$target")" = "$expected_mode" ]; then
          printf "%s\n" unchanged
          exit 0
        fi
        mv --force "$temporary" "$target"
        trap - EXIT HUP INT TERM
        printf "%s\n" changed
      - todo-install
      - "{{ item.path }}"
      - "{{ item.mode }}"
    stdin: "{{ item.content }}"
    stdin_add_newline: false
  loop:
    - path: "{{ m13_config_directory }}/todo_dr.py"
      mode: "0644"
      content: "{{ lookup('ansible.builtin.file', project_root ~ '/scripts/todo_dr.py', rstrip=false) | b64encode }}"
      label: todo_dr.py
    - path: "{{ m13_config_directory }}/todo-dr.json"
      mode: "0600"
      content: >-
        {{
          {
            'primary_name': groups[todo_dr_primary_group | default('todo_primary')][0],
            'primary_address': hostvars[groups[todo_dr_primary_group | default('todo_primary')][0]].todo_node_address,
            'standby_name': groups[todo_dr_standby_group | default('todo_standby')][0],
            'rpo_target_seconds': (
              todo_rpo_target_seconds
              | default(todo_rpo_seconds | default(30))
            )
          } | to_json | b64encode
        }}
      label: todo-dr.json
  loop_control:
    label: "{{ item.label }}"
  register: todo_dr_install
  changed_when: todo_dr_install.stdout | trim == 'changed'
