---
# Transport only: app_installer reseed-group owns the quarantine, every local and
# primary-authentication check for the complete group before the first
# deletion, removal of the application-tier units, and each reseed.
- name: Stage the installer, templates and YAML for every registered database
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/stage-postgres-group.yml"

- name: Rebuild every registered database as a standby of the current primary
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - app_installer
      - reseed-group
      - --primary-address
      - "{{ hostvars[groups['todo_current_primary'][0]].todo_node_address }}"
      - --confirm-fenced
      - "{{ todo_confirm_old_primary_fenced | default('') }}"
      - --confirm-reseed
      - "{{ todo_confirm_reseed | default('') }}"
      - --project-root
      - "{{ app_installer_target }}"
      - --quadlet-dir
      - "{{ app_installer_quadlet }}"
      - --kube-runtime-dir
      - "{{ todo_kube_runtime_directory | default(app_installer_quadlet ~ '/todo-kube-runtime') }}"
      - --rendered-manifest-dir
      - "{{ app_installer_target }}/generated/kube-runtime"
  environment:
    PYTHONPATH: >-
      {{ '/opt/todo/lib' if app_installer_fapolicyd.rc == 0
         else app_installer_target ~ '/deploy/installer' }}
    PYTHONDONTWRITEBYTECODE: "1"
  changed_when: true
