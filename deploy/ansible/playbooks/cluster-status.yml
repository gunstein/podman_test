---
# Read-only status for every registered database, not only Todo.
- name: Read restored replication from current primary
  hosts: todo_current_primary
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Check rebuilt-standby streaming and WAL archiving for every database
      ansible.builtin.include_tasks: ../tasks/cluster-status-check.yml
      vars:
        todo_status_role: primary

- name: Read recovery state from rebuilt standby
  hosts: todo_current_standby
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Check read-only recovery for every database
      ansible.builtin.include_tasks: ../tasks/cluster-status-check.yml
      vars:
        todo_status_role: standby
