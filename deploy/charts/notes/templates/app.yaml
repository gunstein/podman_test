
apiVersion: v1
kind: Pod
metadata:
  name: notes-app
  labels:
    app.kubernetes.io/name: notes
    app.kubernetes.io/component: application
  annotations:
    io.podman.annotations.pids-limit/notes-migrate: "128"
    io.podman.annotations.pids-limit/notes-backend: "128"
    io.podman.annotations.pids-limit/notes-frontend: "128"
spec:
  restartPolicy: Never
  initContainers:
    - name: notes-migrate
      image: {{ .Values.backend.image | quote }}
      imagePullPolicy: Never
      args: [python, -m, backend.migrate, --connect-timeout, "120", up]
      envFrom:
        - configMapRef:
            name: notes-backend-config
            optional: false
      env:
        - name: DATABASE_USER
          value: notes_migrator
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/notes-migrator/database-password
      volumeMounts:
        - name: migrator-secret
          mountPath: /run/secrets/notes-migrator
          readOnly: true
      resources:
        limits:
          memory: {{ .Values.backend.memory | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  containers:
    - name: notes-backend
      image: {{ .Values.backend.image | quote }}
      imagePullPolicy: Never
      ports:
        - name: backend-http
          containerPort: 8000
      envFrom:
        - configMapRef:
            name: notes-backend-config
            optional: false
      env:
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/notes-backend/database-password
      volumeMounts:
        - name: backend-secret
          mountPath: /run/secrets/notes-backend
          readOnly: true
      livenessProbe:
        exec:
          command:
            - python
            - -c
            - >-
              import socket;
              socket.create_connection(("127.0.0.1", 8000), 1).close()
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      resources:
        limits:
          memory: {{ .Values.backend.memory | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]

    - name: notes-frontend
      image: {{ .Values.frontend.image | quote }}
      imagePullPolicy: Never
      ports:
        - name: frontend-http
          containerPort: 8080
      resources:
        limits:
          memory: {{ .Values.frontend.memory | quote }}
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  volumes:
    - name: backend-secret
      secret:
        secretName: notes-kube-backend-secret
        optional: false
        defaultMode: 0444
    - name: migrator-secret
      secret:
        secretName: notes-kube-migrator-secret
        optional: false
        defaultMode: 0444
