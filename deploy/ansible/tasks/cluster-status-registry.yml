---
# Read-only: use the registry an earlier DR playbook already installed on this
# host. No staging, trust update or privilege is needed to report status.
- name: Detect target execution trust policy
  ansible.builtin.command:
    argv: [systemctl, is-active, fapolicyd]
  register: todo_status_fapolicyd
  changed_when: false
  failed_when: todo_status_fapolicyd.rc not in [0, 3, 4]

- name: Read the complete registered database group
  ansible.builtin.command:
    argv: [python3, -m, app_installer, replication-apps, --details]
  environment:
    PYTHONPATH: >-
      {{ '/opt/todo/lib' if todo_status_fapolicyd.rc == 0 else
         (todo_user_home if todo_user_home is defined else '/home/' ~ ansible_user)
         ~ '/.local/share/app-installer/deploy/installer' }}
    PYTHONDONTWRITEBYTECODE: "1"
  register: todo_status_registry
  changed_when: false

- name: Select the registered databases
  ansible.builtin.set_fact:
    todo_status_databases: "{{ todo_status_registry.stdout | from_json }}"
