apiVersion: v1
kind: Pod
metadata:
  name: todo-kube-keycloak
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: identity
  annotations:
    io.podman.annotations.pids-limit/keycloak: "512"
spec:
  restartPolicy: Never
  containers:
    - name: keycloak
      image: localhost/todo-keycloak:m12
      imagePullPolicy: Never
      args:
        - start
        - --import-realm
      ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        - name: cluster
          containerPort: 7800
      envFrom:
        - configMapRef:
            name: todo-keycloak-config
            optional: false
      env:
        - name: KCRAW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-kube-keycloak-secret
              key: database-password
              optional: false
        - name: KCRAW_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-kube-keycloak-secret
              key: bootstrap-admin-password
              optional: false
      livenessProbe:
        exec:
          command:
            - /usr/bin/bash
            - -ec
            - >-
              exec 3<>/dev/tcp/127.0.0.1/9000;
              printf 'GET /auth/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
              timeout 2 grep -m1 -q '^HTTP/1.1 200' <&3
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      resources:
        limits:
          memory: 1Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
