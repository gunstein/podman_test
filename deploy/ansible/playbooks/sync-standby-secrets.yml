---
# Transport only: app_installer.secrets decides which credentials move and
# refuses to overwrite a different existing value. Values travel from primary
# stdout through Ansible memory to standby stdin; never a file, argv or log.
- name: Read the replication group credentials from primary
  hosts: todo_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."

  pre_tasks:
    - name: Require exactly one primary and one standby
      ansible.builtin.assert:
        that:
          - groups['todo_primary'] | length == 1
          - groups['todo_standby'] | length == 1
        fail_msg: This standby demo requires exactly one primary and one standby.

    - name: Check Podman on both hosts
      ansible.builtin.command:
        argv: [podman, --version]
      delegate_to: "{{ item }}"
      loop:
        - "{{ groups['todo_primary'][0] }}"
        - "{{ groups['todo_standby'][0] }}"
      changed_when: false

  tasks:
    - name: Stage the shared installer on primary
      ansible.builtin.include_tasks: ../tasks/stage-installer.yml

    - name: Export the complete replication group credentials
      ansible.builtin.command:
        argv: [python3, -m, app_installer, export-replication-secrets]
      environment:
        PYTHONPATH: >-
          {{ '/opt/todo/lib' if app_installer_fapolicyd.rc == 0
             else app_installer_target ~ '/deploy/installer' }}
        PYTHONDONTWRITEBYTECODE: "1"
      register: primary_replication_secrets
      changed_when: false
      no_log: true

- name: Create the missing credentials on standby
  hosts: todo_standby
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Stage the shared installer on standby
      ansible.builtin.include_tasks: ../tasks/stage-installer.yml

    - name: Import credentials, refusing any different existing value
      ansible.builtin.command:
        argv: [python3, -m, app_installer, import-replication-secrets]
        stdin: "{{ hostvars[groups['todo_primary'][0]].primary_replication_secrets.stdout }}"
        stdin_add_newline: false
      environment:
        PYTHONPATH: >-
          {{ '/opt/todo/lib' if app_installer_fapolicyd.rc == 0
             else app_installer_target ~ '/deploy/installer' }}
        PYTHONDONTWRITEBYTECODE: "1"
      register: standby_replication_secrets
      changed_when: >-
        standby_replication_secrets.rc == 0
        and (standby_replication_secrets.stdout | from_json).changed
      failed_when: false
      no_log: true

    # no_log above hides the stdin values; app_installer's stderr names secrets only.
    - name: Stop on a refused credential import
      ansible.builtin.fail:
        msg: "{{ standby_replication_secrets.stderr }}"
      when: standby_replication_secrets.rc != 0

    - name: Report completed secret synchronization
      ansible.builtin.debug:
        msg: >-
          Standby has the same application and database credentials as primary.
          Secret values were transferred through Ansible memory and SSH only.
