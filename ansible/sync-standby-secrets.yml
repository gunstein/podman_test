---
- name: Copy existing database credentials from primary to standby
  hosts: todo_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    m13_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    m13_postgres_image_archive: "{{ m13_user_home }}/todo-offline-m12/images/postgres-17.11.tar"
    standby_secret_names:
      - todo-db-password
      - todo-migrator-password
      - todo-app-password
      - todo-keycloak-db-password
      - todo-keycloak-admin-password
      - todo-replicator-password

  pre_tasks:
    - name: Require exactly one primary and one standby
      ansible.builtin.assert:
        that:
          - groups['todo_primary'] | length == 1
          - groups['todo_standby'] | length == 1
        fail_msg: This M13 demo requires exactly one primary and one standby.

    - name: Check Podman on both hosts
      ansible.builtin.command:
        argv: [podman, --version]
      delegate_to: "{{ item }}"
      loop:
        - "{{ groups['todo_primary'][0] }}"
        - "{{ groups['todo_standby'][0] }}"
      changed_when: false

    - name: Check the PostgreSQL helper image on primary
      ansible.builtin.command:
        argv: [podman, image, exists, docker.io/library/postgres:17.11]
      changed_when: false

    - name: Check the PostgreSQL helper image on standby
      ansible.builtin.command:
        argv: [podman, image, exists, docker.io/library/postgres:17.11]
      delegate_to: "{{ groups['todo_standby'][0] }}"
      register: standby_helper_image
      changed_when: false
      failed_when: standby_helper_image.rc not in [0, 1]

    - name: Check the offline PostgreSQL archive for the helper image
      ansible.builtin.stat:
        path: "{{ m13_postgres_image_archive }}"
      delegate_to: "{{ groups['todo_standby'][0] }}"
      register: standby_helper_archive
      when: standby_helper_image.rc == 1

    - name: Require a helper image source on standby
      ansible.builtin.assert:
        that:
          - standby_helper_archive.stat.exists
          - standby_helper_archive.stat.isreg
        fail_msg: >-
          PostgreSQL 17.11 is missing on standby. Copy the M12 offline bundle
          there or set m13_postgres_image_archive to its image archive.
      when: standby_helper_image.rc == 1

    - name: Load the PostgreSQL helper image on standby
      ansible.builtin.command:
        argv: [podman, load, --input, "{{ m13_postgres_image_archive }}"]
      delegate_to: "{{ groups['todo_standby'][0] }}"
      changed_when: true
      when: standby_helper_image.rc == 1

  tasks:
    - name: Synchronize each existing secret without a plaintext file
      ansible.builtin.include_tasks: tasks/sync_secret.yml
      loop: "{{ standby_secret_names }}"
      loop_control:
        loop_var: secret_name
        label: "{{ secret_name }}"

    - name: Report completed secret synchronization
      ansible.builtin.debug:
        msg: >-
          Standby has the same application and database credentials as primary.
          Secret values were transferred through Ansible memory and SSH only.
