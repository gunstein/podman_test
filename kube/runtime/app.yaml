apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-nginx-data
  annotations:
    volume.podman.io/uid: "101"
    volume.podman.io/gid: "101"
---
apiVersion: v1
kind: Pod
metadata:
  name: todo-app
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: application
  annotations:
    io.podman.annotations.pids-limit/migrate: "128"
    io.podman.annotations.pids-limit/backend: "128"
    io.podman.annotations.pids-limit/frontend: "128"
spec:
  restartPolicy: Never
  initContainers:
    - name: migrate
      image: localhost/todo-backend:m12
      imagePullPolicy: Never
      args:
        - python
        - -m
        - backend.migrate
        - up
      envFrom:
        - configMapRef:
            name: todo-backend-config
            optional: false
      env:
        - name: DATABASE_USER
          value: todo_migrator
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/todo-migrator/database-password
      volumeMounts:
        - name: migrator-secret
          mountPath: /run/secrets/todo-migrator
          readOnly: true
      resources:
        limits:
          memory: 256Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  containers:
    - name: backend
      image: localhost/todo-backend:m12
      imagePullPolicy: Never
      ports:
        - name: backend-http
          containerPort: 8000
      envFrom:
        - configMapRef:
            name: todo-backend-config
            optional: false
      env:
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/todo-backend/database-password
      volumeMounts:
        - name: backend-secret
          mountPath: /run/secrets/todo-backend
          readOnly: true
      livenessProbe:
        exec:
          command:
            - python
            - -c
            - >-
              import socket;
              socket.create_connection(("127.0.0.1", 8000), 1).close()
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      resources:
        limits:
          memory: 256Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    - name: frontend
      image: localhost/todo-frontend:m12
      imagePullPolicy: Never
      args:
        - nginx
        - -c
        - /etc/todo-nginx/nginx.conf
        - -g
        - daemon off;
      ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
      envFrom:
        - configMapRef:
            name: todo-nginx-env
            optional: false
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/todo-nginx
          readOnly: true
        - name: tls-data
          mountPath: /var/lib/todo-tls
      livenessProbe:
        exec:
          command:
            - nginx
            - -t
            - -c
            - /etc/todo-nginx/nginx.conf
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        limits:
          memory: 128Mi
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  volumes:
    - name: backend-secret
      secret:
        secretName: todo-kube-backend-secret
        optional: false
        defaultMode: 0444
    - name: migrator-secret
      secret:
        secretName: todo-kube-migrator-secret
        optional: false
        defaultMode: 0444
    - name: nginx-config
      configMap:
        name: todo-nginx-config
        optional: false
        defaultMode: 0444
    - name: tls-data
      persistentVolumeClaim:
        claimName: todo-nginx-data
