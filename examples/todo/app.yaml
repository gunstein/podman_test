# The app developer's file: what the Todo app is (docs/PLATFORM-PLAN.md,
# section 5.1). It never names other apps or installation choices; those are
# in the operator's platform.yaml. The source is still in todo-backend/ and
# todo-frontend/ at the repository root; phase 5 moves it here.

name: todo
# The OAuth client its frontend logs in with (todo-frontend/keycloak-adapter.js).
keycloakClient: todo-frontend
# The DR tools check the app by reading /api/<apiCollection> (by default the
# name), which must answer a public read with a list. nginx forwards all of
# /api/ to the backend either way.
apiCollection: todos
# The images it builds (section 5.2), each localhost/todo-<name>. context is
# the build context, relative to this directory; containerfile is relative to
# the context. Both Containerfiles copy from the repository root today.
images:
  backend:
    context: ../..
    containerfile: todo-backend/Containerfile
  frontend:
    context: ../..
    containerfile: todo-frontend/Containerfile
