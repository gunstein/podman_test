---
- name: Run the standby bootstrap preflight
  ansible.builtin.import_playbook: preflight-standby.yml

- name: Prepare PostgreSQL primary for one standby
  hosts: todo_primary
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/../../.."
    todo_rendered_manifest_directory: "{{ project_root }}/generated/kube-runtime"
  any_errors_fatal: true

  roles:
    - role: postgres_primary

- name: Synchronize standby secrets
  ansible.builtin.import_playbook: sync-standby-secrets.yml

- name: Bootstrap the PostgreSQL standby
  hosts: todo_standby
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."
    todo_rendered_manifest_directory: "{{ project_root }}/generated/kube-runtime"
    standby_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    # postgres_archive names the version pinned in todo_installer/settings.py;
    # read it from there instead of duplicating the version number here.
    standby_postgres_archive_name: >-
      {{ (lookup('pipe', 'PYTHONPATH=' ~ project_root ~ '/deploy/installer python3 -m todo_installer app-info')
          | from_json).postgres_archive }}
    standby_postgres_image_archive: "{{ standby_user_home }}/todo-offline-m12/images/{{ standby_postgres_archive_name }}"
    todo_dr_config_directory: "{{ standby_user_home }}/.config/todo"
    standby_quadlet_directory: "{{ standby_user_home }}/.config/containers/systemd"

  roles:
    - role: postgres_standby

- name: Verify streaming replication on primary
  hosts: todo_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Verify each independent replication stream and slot
      ansible.builtin.include_tasks: ../tasks/replicate-workload.yml
      loop: "{{ apps_to_replicate }}"
      loop_control:
        loop_var: todo_replication_app
      vars:
        todo_replication_operation: streaming

    - name: Report successful streaming replication
      ansible.builtin.debug:
        msg: Every registered PostgreSQL standby is streaming through its own physical slot.
