# Run this inventory from the promoted/current primary. Hostnames identify
# machines; groups identify their current roles after promotion.
[todo_current_primary]
todo-standby ansible_connection=local todo_node_address=192.0.2.11

[todo_rebuild_standby]
todo-primary ansible_host=192.0.2.10 todo_node_address=192.0.2.10

[todo_current_standby:children]
todo_rebuild_standby

[todo_promoted:children]
todo_current_primary

[todo_cluster:children]
todo_current_primary
todo_current_standby

[all:vars]
ansible_user=gunstein
todo_user_home=/home/gunstein
todo_rebuild_replication_slot=todo_rebuilt_standby

[todo_promoted:vars]
# Stable browser identity. Point this name at the current primary on the client.
todo_service_hostname=todo.test
todo_service_port=8443
todo_bundle_directory=/home/gunstein/todo-offline-m12
