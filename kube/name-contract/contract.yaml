apiVersion: v1
kind: Pod
metadata:
  name: todo-kube-name-contract
  labels:
    app.kubernetes.io/name: todo-kube-name-contract
    app.kubernetes.io/component: database-name-contract
spec:
  restartPolicy: Never
  containers:
    - name: todo-kube-name-contract
      image: localhost/todo-backend:m12
      imagePullPolicy: Never
      command:
        - sleep
      args:
        - infinity
      livenessProbe:
        exec:
          command:
            - test
            - "!"
            - -e
            - /tmp/todo-kube-force-unhealthy
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
