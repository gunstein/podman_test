---
- name: Roll back the application tier to per-container Quadlets
  hosts: todo_promoted
  gather_facts: false
  any_errors_fatal: true

  vars:
    todo_kube_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    todo_kube_quadlet_directory: >-
      {{ todo_kube_user_home }}/.config/containers/systemd
    todo_kube_runtime_directory: >-
      {{ todo_kube_quadlet_directory }}/todo-kube-runtime
    todo_kube_backup_directory: >-
      {{ todo_kube_user_home }}/.config/todo/quadlet-application-backup

  roles:
    - role: kube_application_rollback
