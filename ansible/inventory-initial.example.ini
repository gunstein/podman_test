# Copy this file to inventory-initial.ini and replace the example addresses.
# 192.0.2.0/24 is reserved for documentation and will not reach your hosts.
[todo_primary]
todo-primary ansible_connection=local todo_node_address=192.0.2.10 todo_node_role=primary

[todo_standby]
todo-standby ansible_host=192.0.2.11 todo_node_address=192.0.2.11 todo_node_role=standby

[todo_cluster:children]
todo_primary
todo_standby

[todo_cluster:vars]
ansible_user=gunstein
# Set todo_user_home here if the remote account does not use /home/<ansible_user>.
# todo_user_home=/srv/todo
todo_rpo_target_seconds=30
