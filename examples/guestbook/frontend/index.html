<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">A shared space</p>
      <h1>Guestbook</h1>
      <p>Leave a message for the next visitor.</p>
      <p id="session" role="status">Connecting to login…</p>
      <button id="login" type="button" hidden>Log in</button>
      <button id="logout" type="button" hidden>Log out</button>
    </header>
    <p id="error" role="alert" hidden></p>
    <section id="book" hidden aria-label="Guestbook entries">
      <form id="entry-form">
        <label for="message">Your message</label>
        <textarea id="message" name="message" rows="4" maxlength="4000" required></textarea>
        <button id="submit" type="submit">Sign guestbook</button>
      </form>
      <div class="entries-heading"><h2>Messages</h2><button id="refresh" type="button">Refresh</button></div>
      <p>Everyone signed in can read and delete entries.</p>
      <p id="empty" hidden>No messages yet. Be the first to sign.</p>
      <ul id="entries"></ul>
    </section>
  </main>
</body>
</html>
