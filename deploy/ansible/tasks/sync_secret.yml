---
- name: "Read from primary | {{ secret_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - --showsecret
      - --format
      - "{{ '{{.SecretData}}' }}"
      - "{{ secret_name }}"
  register: primary_secret_value
  changed_when: false
  no_log: true

- name: "Check on standby | {{ secret_name }}"
  ansible.builtin.command:
    argv: [podman, secret, exists, "{{ secret_name }}"]
  delegate_to: "{{ groups['todo_standby'][0] }}"
  register: standby_secret_check
  changed_when: false
  failed_when: standby_secret_check.rc not in [0, 1]

- name: "Read existing value from standby | {{ secret_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - --showsecret
      - --format
      - "{{ '{{.SecretData}}' }}"
      - "{{ secret_name }}"
  delegate_to: "{{ groups['todo_standby'][0] }}"
  register: standby_secret_value
  changed_when: false
  no_log: true
  when: standby_secret_check.rc == 0

- name: "Reject a different existing value on standby | {{ secret_name }}"
  ansible.builtin.assert:
    that:
      - standby_secret_value.stdout == primary_secret_value.stdout
    fail_msg: >-
      The secret already exists on standby with a different value. It was not
      overwritten. Resolve the mismatch explicitly before continuing.
  no_log: true
  when: standby_secret_check.rc == 0

- name: "Create on standby | {{ secret_name }}"
  ansible.builtin.command:
    argv: [podman, secret, create, "{{ secret_name }}", "-"]
    stdin: "{{ primary_secret_value.stdout }}"
    stdin_add_newline: false
  delegate_to: "{{ groups['todo_standby'][0] }}"
  no_log: true
  changed_when: true
  when: standby_secret_check.rc == 1
