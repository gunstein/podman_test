---
- name: Check the PostgreSQL image on standby
  ansible.builtin.command:
    argv: [podman, image, exists, docker.io/library/postgres:17.11]
  register: standby_postgres_image
  changed_when: false
  failed_when: standby_postgres_image.rc not in [0, 1]

- name: Check the offline PostgreSQL archive when the image is missing
  ansible.builtin.stat:
    path: "{{ m13_postgres_image_archive }}"
  register: standby_postgres_archive
  when: standby_postgres_image.rc == 1

- name: Require an available PostgreSQL image source
  ansible.builtin.assert:
    that:
      - standby_postgres_archive.stat.exists
      - standby_postgres_archive.stat.isreg
    fail_msg: >-
      PostgreSQL 17.11 is missing on standby. Set m13_postgres_image_archive to
      the postgres-17.11.tar file from the M12 offline bundle.
  when: standby_postgres_image.rc == 1

- name: Load PostgreSQL from the offline archive
  ansible.builtin.command:
    argv: [podman, load, --input, "{{ m13_postgres_image_archive }}"]
  changed_when: true
  when: standby_postgres_image.rc == 1

- name: Confirm the replication secret exists on standby
  ansible.builtin.command:
    argv: [podman, secret, exists, todo-replicator-password]
  changed_when: false

- name: Verify standby can reach the primary replication port
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['todo_primary'][0]].todo_node_address }}"
    port: 5432
    connect_timeout: 2
    timeout: 10
    state: started
    msg: Standby cannot reach primary TCP port 5432. Check the host firewall.

- name: Recheck that standby has no database volume
  ansible.builtin.command:
    argv: [podman, volume, exists, todo-postgres-data]
  register: standby_volume_before_bootstrap
  changed_when: false
  failed_when: standby_volume_before_bootstrap.rc not in [0, 1]

- name: Refuse to overwrite standby data
  ansible.builtin.assert:
    that:
      - standby_volume_before_bootstrap.rc == 1
    fail_msg: >-
      todo-postgres-data already exists on standby. Bootstrap never overwrites
      or repairs an existing database volume automatically.

- name: Create the empty standby database volume
  ansible.builtin.command:
    argv: [podman, volume, create, todo-postgres-data]
  changed_when: true

- name: Initialize standby from a streamed base backup
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - host
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --pids-limit
      - "128"
      - --volume
      - todo-postgres-data:/var/lib/postgresql/data:U,Z
      - --secret
      - todo-replicator-password,type=env,target=PGPASSWORD
      - docker.io/library/postgres:17.11
      - pg_basebackup
      - --host={{ hostvars[groups['todo_primary'][0]].todo_node_address }}
      - --port=5432
      - --username=todo_replicator
      - --pgdata=/var/lib/postgresql/data
      - --format=plain
      - --wal-method=stream
      - --write-recovery-conf
      - --create-slot
      - --slot=todo_standby
      - --progress
  changed_when: true

- name: Restrict the standby data directory permissions
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --volume
      - todo-postgres-data:/var/lib/postgresql/data:Z
      - --entrypoint
      - chmod
      - docker.io/library/postgres:17.11
      - "0700"
      - /var/lib/postgresql/data
  changed_when: true

- name: Install standby replication settings in the database volume
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --volume
      # Final helper hands the stopped volume to Kube, which does not replace
      # an existing private MCS label. Match the shared Kube volume label.
      - todo-postgres-data:/var/lib/postgresql/data:z
      - --secret
      - todo-replicator-password
      - --entrypoint
      - /bin/sh
      - docker.io/library/postgres:17.11
      - -ec
      - |
        data=/var/lib/postgresql/data
        passfile=$data/.todo-replication.pgpass
        auto=$data/postgresql.auto.conf
        umask 077
        printf '%s:%s:replication:%s:' "$1" 5432 todo_replicator > "$passfile"
        cat /run/secrets/todo-replicator-password >> "$passfile"
        printf '\n' >> "$passfile"
        sed -i '/^primary_conninfo =/d; /^primary_slot_name =/d' "$auto"
        printf "primary_conninfo = 'host=%s port=5432 user=todo_replicator application_name=%s passfile=%s'\n" "$1" "$3" "$passfile" >> "$auto"
        printf "primary_slot_name = '%s'\n" "$2" >> "$auto"
      - todo-standby-config
      - "{{ hostvars[groups['todo_primary'][0]].todo_node_address }}"
      - todo_standby
      - todo_standby
  changed_when: true
  no_log: true

- name: Install the shared PostgreSQL Kube runtime on standby
  ansible.builtin.include_role:
    name: postgres_kube_runtime
  vars:
    todo_postgres_publish_address: ""

- name: Start standby PostgreSQL through its Kube unit
  ansible.builtin.systemd_service:
    name: todo-postgres.service
    scope: user
    state: started

- name: Wait for healthy standby PostgreSQL
  ansible.builtin.command:
    argv: [podman, wait, --condition=healthy, todo-postgres]
  changed_when: false

- name: Verify PostgreSQL is in recovery
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - todo-postgres
      - psql
      - --username
      - todo
      - --dbname
      - todo
      - --tuples-only
      - --no-align
      - --command
      - SELECT pg_is_in_recovery();
  register: standby_recovery_state
  changed_when: false
  failed_when: standby_recovery_state.stdout | trim != 't'
