apiVersion: v1
kind: Pod
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: identity
  annotations:
    io.podman.annotations.pids-limit/keycloak: "512"
spec:
  restartPolicy: Never
  containers:
    - name: keycloak
      image: {{ .Values.keycloak.image | quote }}
      imagePullPolicy: Never
      args: [start, --import-realm]
      ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        - name: cluster
          containerPort: 7800
      envFrom:
        - configMapRef:
            name: keycloak-config
            optional: false
      env:
        - name: KCRAW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-kube-postgres-secret
              key: database-password
              optional: false
        - name: KCRAW_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-kube-admin-secret
              key: bootstrap-admin-password
              optional: false
      livenessProbe:
        exec:
          command:
            - /usr/bin/bash
            - -ec
            - >-
              exec 3<>/dev/tcp/127.0.0.1/9000;
              printf 'GET /auth/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
              timeout 2 grep -m1 -q '^HTTP/1.1 200' <&3
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      resources:
        limits:
          memory: {{ .Values.keycloak.memory | quote }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_DB: postgres
  KC_DB_URL_HOST: keycloak-postgres
  KC_DB_URL_PORT: "5432"
  KC_DB_URL_DATABASE: keycloak
  KC_DB_USERNAME: keycloak
  KC_HTTP_ENABLED: "true"
  KC_HTTP_RELATIVE_PATH: /auth
  KC_HOSTNAME: {{ printf "https://%s:%v/auth" .Values.runtime.publicHostname .Values.runtime.publicPort | quote }}
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_CACHE: ispn
  KC_CACHE_STACK: jdbc-ping
  KC_SPI_CACHE_EMBEDDED__DEFAULT__NODE_NAME: keycloak
