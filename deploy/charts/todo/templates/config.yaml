apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-postgres-config
data:
  POSTGRES_DB: todo
  POSTGRES_USER: todo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-config
data:
  DATABASE_HOST: todo-postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: todo
  DATABASE_USER: todo_app
  LOG_LEVEL: {{ .Values.runtime.logLevel | quote }}
  OIDC_ISSUER: {{ printf "https://%s:%v/auth/realms/todo" .Values.runtime.publicHostname .Values.runtime.publicPort | quote }}
  OIDC_JWKS_URL: http://todo-keycloak:8080/auth/realms/todo/protocol/openid-connect/certs
  OIDC_AUDIENCE: todo-frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-keycloak-config
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_DB: postgres
  KC_DB_URL_HOST: todo-postgres
  KC_DB_URL_PORT: "5432"
  KC_DB_URL_DATABASE: todo
  KC_DB_SCHEMA: keycloak
  KC_DB_USERNAME: keycloak_app
  KC_HTTP_ENABLED: "true"
  KC_HTTP_RELATIVE_PATH: /auth
  KC_HOSTNAME: {{ printf "https://%s:%v/auth" .Values.runtime.publicHostname .Values.runtime.publicPort | quote }}
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_CACHE: ispn
  KC_CACHE_STACK: jdbc-ping
  KC_SPI_CACHE_EMBEDDED__DEFAULT__NODE_NAME: todo-keycloak
