---
- name: Read Podman Kube options for the shared proxy
  ansible.builtin.command:
    argv: [podman, kube, play, --help]
  register: todo_proxy_kube_help
  changed_when: false

- name: Require stable Podman Kube container-name support for the shared proxy
  ansible.builtin.assert:
    that:
      - "'--no-pod-prefix' in todo_proxy_kube_help.stdout"
    fail_msg: The shared proxy Kube runtime requires Podman --no-pod-prefix.

- name: Refuse the legacy frontend container Quadlet
  ansible.builtin.stat:
    path: "{{ todo_quadlet_directory }}/todo-frontend.container"
  register: todo_proxy_legacy_quadlet

- name: Require a Kube-native proxy host
  ansible.builtin.assert:
    that:
      - not todo_proxy_legacy_quadlet.stat.exists
    fail_msg: >-
      Unsupported legacy frontend container Quadlet is installed. Stop and
      review the host separately before installing the shared Kube proxy.

- name: Create the shared proxy Kube runtime directory
  ansible.builtin.file:
    path: "{{ todo_kube_runtime_directory }}"
    state: directory
    mode: "0700"

- name: Install the shared proxy manifest and ConfigMap
  ansible.builtin.copy:
    src: "{{ todo_rendered_manifest_directory }}/{{ item }}"
    dest: "{{ todo_kube_runtime_directory }}/{{ item }}"
    mode: "0600"
  loop:
    - shared-proxy.yaml
    - config.yaml
  register: todo_proxy_kube_manifests

- name: Install shared proxy network and TLS volume Quadlets
  ansible.builtin.copy:
    src: "{{ project_root }}/quadlet/{{ item }}"
    dest: "{{ todo_quadlet_directory }}/{{ item }}"
    mode: "0644"
  loop:
    - todo.network
    - todo-nginx-data.volume
  register: todo_proxy_kube_resources

- name: Install the shared proxy Kube Quadlet
  ansible.builtin.template:
    src: shared-proxy.kube.j2
    dest: "{{ todo_kube_runtime_directory }}/shared-proxy.kube"
    mode: "0644"
  register: todo_proxy_kube_units

- name: Record whether the shared proxy Kube definition changed
  ansible.builtin.set_fact:
    todo_proxy_kube_changed: >-
      {{
        todo_proxy_kube_manifests.changed or
        todo_proxy_kube_resources.changed or
        todo_proxy_kube_units.changed
      }}

- name: Reload shared proxy user systemd units
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
