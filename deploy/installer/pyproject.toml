[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "app-installer"
version = "0.1.0"
requires-python = ">=3.9"
# Build and dev mode render with these; an offline install and the DR tools
# need only the standard library (target_render), and DR also PyYAML.
dependencies = ["jinja2", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["app_installer*"]
