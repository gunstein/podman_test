---
- name: Query the target application registry
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-m', 'todo_installer', 'app-info'] +
         (['--app', todo_metadata_app] if todo_metadata_app | default('') | length > 0 else []) }}
  environment:
    PYTHONPATH: >-
      {{ '/opt/todo/lib' if todo_installer_fapolicyd.rc == 0
         else todo_installer_target ~ '/deploy/installer' }}
    PYTHONDONTWRITEBYTECODE: "1"
  register: todo_application_info
  changed_when: false

- name: Use names derived by the shared App object
  ansible.builtin.set_fact:
    todo_app_metadata: "{{ todo_application_info.stdout | from_json }}"
