# The app developer's file: what the Todo app is (docs/PLATFORM-PLAN.md,
# section 5.1). It never names other apps or installation choices; those are
# in the operator's platform.yaml. The source is still in todo-backend/ and
# todo-frontend/ at the repository root; phase 5 moves it here.

name: todo
# Its own PostgreSQL database, replicated for DR (platform.yaml gives the
# replicationPort). Without database: true the platform makes none.
database: true
# The OAuth client its frontend logs in with at the shared Keycloak
# (todo-frontend/keycloak-adapter.js). Without keycloakClient the app has no
# login; Keycloak runs only when some app has one.
keycloakClient: todo-frontend
# The images it builds (section 5.2), each localhost/todo-<name>. context is
# the build context, relative to this directory; containerfile is relative to
# the context. Both Containerfiles copy from the repository root today.
images:
  backend:
    context: ../..
    containerfile: todo-backend/Containerfile
  frontend:
    context: ../..
    containerfile: todo-frontend/Containerfile
# The ports in its pod that nginx sends requests to (section 5.3).
endpoints:
  frontend:
    port: 8080
  backend:
    port: 8000
# The paths on its own hostname and the endpoint each goes to: a prefix path
# ends with a slash, exact: true matches the whole path. /auth/ is the
# platform's (Keycloak) on every app's hostname.
routes:
  - path: /api/
    to: backend
  - path: /health
    exact: true
    to: backend
  - path: /ready
    exact: true
    to: backend
  - path: /
    to: frontend
# The app is ready when this path on its hostname answers 200: its backend's
# /ready answers 503 until the database takes a query. The platform waits for
# it after a start.
ready: /ready
# Checked once it is ready, after an install and after a DR promotion: each a
# GET on its hostname and the status it must answer. /api/todos is a
# public read through the backend.
checks:
  - path: /health
    status: 200
  - path: /api/todos
    status: 200
