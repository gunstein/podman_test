---
- name: Provision Todo runtime secrets from an authoritative encrypted input
  hosts: all
  gather_facts: false
  any_errors_fatal: true

  vars:
    todo_application_secret_names:
      - todo-db-password
      - todo-migrator-password
      - todo-app-password
      - todo-keycloak-db-password
      - todo-keycloak-admin-password
    todo_required_secret_names: >-
      {{
        todo_application_secret_names
        + (['todo-replicator-password'] if 'todo_cluster' in groups else [])
      }}

  pre_tasks:
    - name: Require every managed secret value
      ansible.builtin.assert:
        that:
          - todo_managed_secrets | default({}) is mapping
          - >-
            todo_required_secret_names |
            difference((todo_managed_secrets | default({})).keys() | list) |
            length == 0
        fail_msg: >-
          Supply every required value through an encrypted extra-vars file.
          Never commit ansible/secrets.yml or its Vault password.
      no_log: true

    - name: Reject placeholders and invalid managed secrets
      ansible.builtin.assert:
        that:
          - todo_managed_secrets[item] is string
          - todo_managed_secrets[item] | length >= 16
          - todo_managed_secrets[item] is not match('^CHANGE_ME')
          - >-
            item != 'todo-replicator-password' or
            todo_managed_secrets[item] is match('^[A-Za-z0-9]{32}$')
        fail_msg: >-
          Use a real value of at least 16 characters. The replication password
          must be exactly 32 alphanumeric characters.
      loop: "{{ todo_required_secret_names }}"
      no_log: true

    - name: Require unique managed secret values
      ansible.builtin.assert:
        that:
          - >-
            todo_required_secret_names |
            map('extract', todo_managed_secrets) |
            unique | list | length == todo_required_secret_names | length
        fail_msg: Every managed credential must have a distinct value.
      no_log: true

    - name: Check Podman on every target host
      ansible.builtin.command:
        argv: [podman, --version]
      changed_when: false

  tasks:
    - name: Provision each host-local Podman runtime secret
      ansible.builtin.include_tasks: tasks/provision_secret.yml
      loop: "{{ todo_required_secret_names }}"
      loop_control:
        loop_var: secret_name
        label: "{{ secret_name }}"
