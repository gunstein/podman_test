apiVersion: v1
kind: ConfigMap
metadata:
  name: "todo-postgres-config"
data:
  POSTGRES_DB: "todo"
  POSTGRES_USER: "todo"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "todo-backend-config"
data:
  DATABASE_HOST: "todo-postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "todo"
  LOG_LEVEL: "debug"
  OIDC_ISSUER: "https://auth.test:8443/auth/realms/todo"
  OIDC_JWKS_URL: "http://keycloak:8080/auth/realms/todo/protocol/openid-connect/certs"
  OIDC_AUDIENCE: "todo-api"
  # The frontend's /config/login.json (keycloak.frontend_login): its pod mounts this key alone.
  FRONTEND_LOGIN: "{\"clientId\": \"todo-frontend\", \"discovery\": \"/auth/realms/todo/.well-known/openid-configuration\", \"realm\": \"todo\"}"
