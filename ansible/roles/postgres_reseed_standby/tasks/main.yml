---
- name: Stop all Todo services before reseed
  ansible.builtin.command: {argv: [systemctl, --user, stop, "{{ item }}"]}
  loop:
    - todo-app.service
    - todo-frontend.service
    - todo-backend.service
    - todo-keycloak.service
    - todo-postgres.service
  register: m16_reseed_stopped
  changed_when: false
  failed_when: m16_reseed_stopped.rc not in [0, 5]

- name: Require PostgreSQL image before destructive reseed
  ansible.builtin.command: {argv: [podman, image, exists, docker.io/library/postgres:17.11]}
  changed_when: false

- name: Verify rebuild host can reach current primary replication port
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['todo_current_primary'][0]].todo_node_address }}"
    port: 5432
    connect_timeout: 2
    timeout: 10
    state: started
    msg: >-
      Rebuild host cannot reach current primary TCP 5432. Keep client traffic
      fenced, but allow only this standby through the primary host firewall.

- name: Authenticate replication before destructive reseed
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - host
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --pids-limit
      - "64"
      - --secret
      - todo-replicator-password,type=env,target=PGPASSWORD
      - docker.io/library/postgres:17.11
      - psql
      - >-
        --dbname=host={{ hostvars[groups['todo_current_primary'][0]].todo_node_address }}
        port=5432 user=todo_replicator replication=true connect_timeout=5
      - --no-psqlrc
      - --tuples-only
      - --no-align
      - --command=IDENTIFY_SYSTEM;
  register: m16_reseed_replication_probe
  changed_when: false
  failed_when: >-
    m16_reseed_replication_probe.rc != 0 or
    m16_reseed_replication_probe.stdout | trim == ''

- name: Remove application-tier Quadlets from rebuilt standby
  ansible.builtin.file:
    path: "{{ m16_quadlet_directory }}/{{ item }}"
    state: absent
  loop:
    - todo-frontend.container
    - todo-backend.container
    - todo-keycloak.container
    - todo-db-setup.container
    - todo-migrate.container
    - todo-db-grants.container
    - todo-nginx-data.volume

- name: Remove application Kube units from rebuilt standby
  ansible.builtin.file:
    path: "{{ m16_quadlet_directory }}/todo-kube-runtime/{{ item }}"
    state: absent
  loop:
    - todo-app.kube
    - todo-keycloak.kube
    - app.yaml
    - keycloak.yaml

- name: Remove the explicitly confirmed old database volume
  ansible.builtin.command: {argv: [podman, volume, rm, todo-postgres-data]}
  changed_when: true

- name: Create the empty rebuilt standby volume
  ansible.builtin.command: {argv: [podman, volume, create, todo-postgres-data]}
  changed_when: true

- name: Stream a new base backup from the current primary
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - host
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --pids-limit
      - "128"
      - --volume
      - todo-postgres-data:/var/lib/postgresql/data:U,Z
      - --secret
      - todo-replicator-password,type=env,target=PGPASSWORD
      - docker.io/library/postgres:17.11
      - pg_basebackup
      - "--host={{ hostvars[groups['todo_current_primary'][0]].todo_node_address }}"
      - --port=5432
      - --username=todo_replicator
      - --pgdata=/var/lib/postgresql/data
      - --format=plain
      - --wal-method=stream
      - --write-recovery-conf
      - --create-slot
      - "--slot={{ todo_rebuild_replication_slot }}"
      - --progress
  changed_when: true

- name: Restrict rebuilt standby data permissions
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --volume
      - todo-postgres-data:/var/lib/postgresql/data:Z
      - --entrypoint
      - chmod
      - docker.io/library/postgres:17.11
      - "0700"
      - /var/lib/postgresql/data
  changed_when: true

- name: Install rebuilt standby replication settings in the data volume
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --volume
      - todo-postgres-data:/var/lib/postgresql/data:Z
      - --secret
      - todo-replicator-password
      - --entrypoint
      - /bin/sh
      - docker.io/library/postgres:17.11
      - -ec
      - |
        data=/var/lib/postgresql/data
        passfile=$data/.todo-replication.pgpass
        auto=$data/postgresql.auto.conf
        umask 077
        printf '%s:%s:replication:%s:' "$1" 5432 todo_replicator > "$passfile"
        cat /run/secrets/todo-replicator-password >> "$passfile"
        printf '\n' >> "$passfile"
        sed -i '/^primary_conninfo =/d; /^primary_slot_name =/d' "$auto"
        printf "primary_conninfo = 'host=%s port=5432 user=todo_replicator application_name=%s passfile=%s'\n" "$1" "$3" "$passfile" >> "$auto"
        printf "primary_slot_name = '%s'\n" "$2" >> "$auto"
      - todo-rebuilt-standby-config
      - "{{ hostvars[groups['todo_current_primary'][0]].todo_node_address }}"
      - "{{ todo_rebuild_replication_slot }}"
      - "{{ todo_rebuild_replication_slot }}"
  changed_when: true
  no_log: true

- name: Install the shared PostgreSQL Kube runtime on rebuilt standby
  ansible.builtin.include_role:
    name: postgres_kube_runtime
  vars:
    todo_postgres_publish_address: ""

- name: Start rebuilt PostgreSQL standby through its Kube unit
  ansible.builtin.systemd_service:
    name: todo-postgres.service
    scope: user
    state: started

- name: Wait for healthy rebuilt PostgreSQL standby
  ansible.builtin.command:
    argv: [podman, wait, --condition=healthy, todo-postgres]
  changed_when: false

- name: Require rebuilt PostgreSQL recovery mode
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - todo-postgres
      - psql
      - --username
      - todo
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --command
      - SELECT pg_is_in_recovery();
  register: m16_reseed_recovery
  changed_when: false
  failed_when: m16_reseed_recovery.stdout | trim != 't'
