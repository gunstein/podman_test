---
- name: Configure PostgreSQL continuous archiving on the promoted host
  hosts: todo_promoted
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."
    backup_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    backup_config_directory: "{{ backup_user_home }}/.config/todo"

  roles:
    - role: postgres_backup
