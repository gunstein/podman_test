---
# Transport only: replication.py owns PostgreSQL commands and App-derived names.
- name: Stage the shared replication implementation
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/stage-installer.yml"

- name: Require the DR YAML parser
  ansible.builtin.command:
    argv: [python3, -c, 'import yaml']
  changed_when: false

- name: Read the selected replication application
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/app-info.yml"
  vars:
    todo_metadata_app: "{{ todo_replication_app }}"

- name: Stage canonical replication templates
  ansible.builtin.copy:
    src: "{{ project_root }}/deploy/quadlet/{{ item }}"
    dest: "{{ app_installer_target }}/deploy/quadlet/{{ item }}"
    mode: "0600"
  loop: "{{ todo_app_metadata.templates }}"
  when: todo_replication_operation in ['standby', 'reseed-check']

- name: Stage the canonical database and ConfigMap YAML
  ansible.builtin.copy:
    src: "{{ todo_rendered_manifest_directory | default(project_root ~ '/generated/kube-runtime') }}/{{ item }}"
    dest: "{{ app_installer_target }}/generated/kube-runtime/{{ item }}"
    mode: "0600"
  loop: "{{ todo_app_metadata.manifests.postgres }}"
  when: todo_replication_operation in ['standby', 'reseed-check']

- name: Execute replication mechanics for the selected application
  ansible.builtin.command:
    argv: >-
      {{ ['python3', '-m', 'app_installer', 'replicate-workload', todo_replication_operation,
          '--app', todo_replication_app,
          '--project-root', app_installer_target,
          '--quadlet-dir', app_installer_quadlet,
          '--kube-runtime-dir', todo_kube_runtime_directory | default(app_installer_quadlet ~ '/todo-kube-runtime'),
          '--rendered-manifest-dir', app_installer_target ~ '/generated/kube-runtime',
          '--node-address', todo_node_address | default(''),
          '--primary-address', todo_replication_primary_address | default('')]
         + (['--image-archive', todo_replication_image_archive] if todo_replication_image_archive is defined else [])
         + (['--slot', todo_replication_slot] if todo_replication_slot is defined else [])
         + (['--rebuilt'] if todo_replication_rebuilt | default(false) | bool else [])
         + (['--confirm-fenced', todo_confirm_old_primary_fenced | default(''),
             '--confirm-reseed', todo_confirm_reseed | default('')]
            if todo_replication_operation == 'reseed-check' else []) }}
  environment:
    PYTHONPATH: >-
      {{ '/opt/todo/lib' if app_installer_fapolicyd.rc == 0
         else app_installer_target ~ '/deploy/installer' }}
    PYTHONDONTWRITEBYTECODE: "1"
  register: todo_replication_result
  changed_when: (todo_replication_result.stdout | from_json).changed
  retries: "{{ 15 if todo_replication_operation == 'streaming' else 0 }}"
  delay: 2
  until: todo_replication_result.rc == 0
