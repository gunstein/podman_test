---
# Read-only: app_installer cluster-status checks every registered database for
# the given role. It uses the registry an earlier DR playbook already installed
# on this host; no staging, trust update or privilege is needed to report status.
- name: Detect target execution trust policy
  ansible.builtin.command:
    argv: [systemctl, is-active, fapolicyd]
  register: todo_status_fapolicyd
  changed_when: false
  failed_when: todo_status_fapolicyd.rc not in [0, 3, 4]

- name: Check every registered database as {{ todo_status_role }}
  ansible.builtin.command:
    argv: [python3, -m, app_installer, cluster-status, "{{ todo_status_role }}"]
  environment:
    PYTHONPATH: >-
      {{ '/opt/todo/lib' if todo_status_fapolicyd.rc == 0 else
         (todo_user_home if todo_user_home is defined else '/home/' ~ ansible_user)
         ~ '/.local/share/app-installer/deploy/installer' }}
    PYTHONDONTWRITEBYTECODE: "1"
  register: todo_cluster_status
  changed_when: false

- name: Show the state of every registered database as {{ todo_status_role }}
  ansible.builtin.debug:
    msg: "{{ todo_cluster_status.stdout | from_json }}"
