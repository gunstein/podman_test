---
- name: Deploy the application tier on the promoted host
  hosts: todo_promoted
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."
    promoted_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    promoted_config_directory: "{{ promoted_user_home }}/.config/todo"
    promoted_bundle_directory: '{{ todo_bundle_directory | default(promoted_user_home ~ "/todo-offline-m12") }}'
    # Fixed by the rendered production ConfigMap and TLS/OIDC contract; the
    # issuer hostname comes from the app registry's shared-resource owner.
    promoted_service_port: 8443
    promoted_node_address: "{{ todo_node_address }}"

  roles:
    - role: promoted_application
