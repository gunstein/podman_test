apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-kube-repl-standby-data
  annotations:
    volume.podman.io/uid: "999"
    volume.podman.io/gid: "999"
---
apiVersion: v1
kind: Pod
metadata:
  name: todo-kube-repl-standby
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: replication-standby
  annotations:
    io.podman.annotations.pids-limit/basebackup: "128"
    io.podman.annotations.pids-limit/postgres: "256"
spec:
  restartPolicy: Never
  initContainers:
    - name: basebackup
      image: docker.io/library/postgres:17.11
      imagePullPolicy: Never
      command:
        - /bin/sh
        - -ec
      args:
        - |
          if test -s "$PGDATA/PG_VERSION"; then
            echo "Existing PostgreSQL data found; base backup skipped."
            exit 0
          fi

          if test -n "$(find "$PGDATA" -mindepth 1 -maxdepth 1 -print -quit)"; then
            echo "Refusing non-empty partial standby data directory." >&2
            exit 1
          fi

          pg_basebackup \
            --host="$TODO_PRIMARY_HOST" \
            --port="$TODO_PRIMARY_PORT" \
            --username="$TODO_REPLICATION_USER" \
            --pgdata="$PGDATA" \
            --format=plain \
            --wal-method=stream \
            --write-recovery-conf \
            --create-slot \
            --slot="$TODO_REPLICATION_SLOT" \
            --progress

          chmod 0700 "$PGDATA"
      envFrom:
        - configMapRef:
            name: todo-kube-repl-standby-config
            optional: false
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-kube-repl-standby-secret
              key: replication-password
              optional: false
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      resources:
        limits:
          memory: 256Mi
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  containers:
    - name: postgres
      image: docker.io/library/postgres:17.11
      imagePullPolicy: Never
      command:
        - /bin/sh
        - -ec
      args:
        - |
          pgpass=/tmp/todo-kube-replication.pgpass
          umask 077
          printf '%s:%s:replication:%s:' \
            "$TODO_PRIMARY_HOST" \
            "$TODO_PRIMARY_PORT" \
            "$TODO_REPLICATION_USER" > "$pgpass"
          cat /run/secrets/todo-kube-repl/replication-password >> "$pgpass"
          printf '\n' >> "$pgpass"

          exec postgres -D "$PGDATA" \
            -c "primary_conninfo=host=$TODO_PRIMARY_HOST port=$TODO_PRIMARY_PORT user=$TODO_REPLICATION_USER application_name=$TODO_STANDBY_APPLICATION_NAME passfile=$pgpass" \
            -c "primary_slot_name=$TODO_REPLICATION_SLOT"
      ports:
        - name: postgres
          containerPort: 5432
      envFrom:
        - configMapRef:
            name: todo-kube-repl-standby-config
            optional: false
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-secret
          mountPath: /run/secrets/todo-kube-repl
          readOnly: true
      livenessProbe:
        exec:
          command:
            - pg_isready
            - --username
            - todo
            - --dbname
            - todo
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      resources:
        limits:
          memory: 512Mi
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: todo-kube-repl-standby-data
    - name: postgres-secret
      secret:
        secretName: todo-kube-repl-standby-secret
        optional: false
        defaultMode: 0444
