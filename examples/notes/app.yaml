# The app developer's file: what the Notes app is (docs/PLATFORM-PLAN.md,
# section 5.1). It never names other apps or installation choices; those are
# in the operator's platform.yaml. Its source is beside it: backend/ (FastAPI
# and its migrations) and frontend/ (static files and the login adapter).

name: notes
# Its own PostgreSQL database, replicated for DR (platform.yaml gives the
# replicationPort). Without database: true the platform makes none.
database: true
# Its login at the shared Keycloak (docs/IDENTITY.md): the OAuth client its
# frontend logs in with (frontend/keycloak-adapter.js), and the audience
# its backend accepts in an access token. They differ, so an ID token, which
# names the client, is refused by the API. Without login the app has none;
# Keycloak runs only when some app has login.
login:
  client: notes-frontend
  audience: notes-api
# The images it builds (section 5.2), each localhost/notes-<name>; see
# examples/todo/app.yaml.
images:
  backend:
    context: backend
  frontend:
    context: frontend
# The ports in its pod that nginx sends requests to (section 5.3).
endpoints:
  frontend:
    port: 8080
  backend:
    port: 8000
# The paths on its own hostname and the endpoint each goes to: a prefix path
# ends with a slash, exact: true matches the whole path. /auth/ is the
# platform's (Keycloak) on every app's hostname.
routes:
  - path: /api/
    to: backend
  - path: /health
    exact: true
    to: backend
  - path: /ready
    exact: true
    to: backend
  - path: /
    to: frontend
# The app is ready when this path on its hostname answers 200: its backend's
# /ready answers 503 until the database takes a query. The platform waits for
# it after a start.
ready: /ready
# Checked once it is ready, after an install and after a DR promotion: each a
# GET on its hostname and the status it must answer. /api/notes is a
# public read through the backend.
checks:
  - path: /health
    status: 200
  - path: /api/notes
    status: 200
