apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-nginx-data
  annotations:
    volume.podman.io/uid: "101"
    volume.podman.io/gid: "101"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-nginx-env
data:
  TODO_TLS_HOSTNAME: {{ .Values.runtime.publicHostname | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;

    events { worker_connections 1024; }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        sendfile on;
        keepalive_timeout 65;
        server_tokens off;

        upstream todo_frontend { server todo-app:8080; }
        upstream todo_backend { server todo-app:8000; }
        upstream todo_keycloak { server todo-keycloak:8080; }

        server {
            listen 8080;
            listen 8443 ssl;
            server_name {{ .Values.runtime.publicHostname }};
            ssl_certificate /var/lib/todo-tls/server.crt;
            ssl_certificate_key /var/lib/todo-tls/server.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_session_tickets off;
            root /usr/share/nginx/html;
            index index.html;
            add_header X-Content-Type-Options nosniff always;

            location /auth/ {
                proxy_pass http://todo_keycloak;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location /api/ {
                proxy_pass http://todo_backend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location = /health {
                proxy_pass http://todo_backend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location = /ready {
                proxy_pass http://todo_backend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location / {
                proxy_pass http://todo_frontend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-proxy
  labels:
    app.kubernetes.io/name: shared-proxy
    app.kubernetes.io/component: proxy
  annotations:
    io.podman.annotations.pids-limit/nginx: "128"
spec:
  restartPolicy: Never
  containers:
    - name: nginx
      image: {{ .Values.proxy.image | quote }}
      imagePullPolicy: Never
      args: [nginx, -c, /etc/todo-nginx/nginx.conf, -g, "daemon off;"]
      ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
      envFrom:
        - configMapRef:
            name: shared-nginx-env
            optional: false
      volumeMounts:
        - name: nginx-config
          mountPath: /etc/todo-nginx
          readOnly: true
        - name: tls-data
          mountPath: /var/lib/todo-tls
      livenessProbe:
        exec:
          command: [nginx, -t, -c, /etc/todo-nginx/nginx.conf]
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        limits:
          memory: {{ .Values.proxy.memory | quote }}
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  volumes:
    - name: nginx-config
      configMap:
        name: shared-nginx-config
        optional: false
        defaultMode: 0444
    - name: tls-data
      persistentVolumeClaim:
        claimName: todo-nginx-data
