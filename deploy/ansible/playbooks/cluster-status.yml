---
# Read-only status for every registered database, not only Todo.
- name: Read restored replication from current primary
  hosts: todo_current_primary
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Read the registered database group
      ansible.builtin.include_tasks: ../tasks/cluster-status-registry.yml

    - name: Check rebuilt-standby streaming and WAL archiving for each database
      ansible.builtin.include_tasks: ../tasks/cluster-status-primary.yml
      loop: "{{ todo_status_databases }}"
      loop_control:
        loop_var: todo_status_db
        label: "{{ todo_status_db.name }}"

- name: Read recovery state from rebuilt standby
  hosts: todo_current_standby
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Read the registered database group
      ansible.builtin.include_tasks: ../tasks/cluster-status-registry.yml

    - name: Check read-only recovery for each database
      ansible.builtin.include_tasks: ../tasks/cluster-status-standby.yml
      loop: "{{ todo_status_databases }}"
      loop_control:
        loop_var: todo_status_db
        label: "{{ todo_status_db.name }}"
