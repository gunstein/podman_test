---
# Transport only, run on the promoted host itself: app_installer.promoted owns
# the identity and promotion gates, workload installation, the grouped restart,
# readiness, the canonical issuer, client redirects and the public CA export.
- name: Stage the trusted installer and read the complete database group
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/read-replication-registry.yml"

- name: Deploy and verify the application tier for the promoted group
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - app_installer
      - deploy-promoted
      - --project-root
      - "{{ project_root }}"
      - --quadlet-dir
      - "{{ app_installer_quadlet }}"
      - --bundle-dir
      - "{{ promoted_bundle_directory }}"
      - --inventory-hostname
      - "{{ inventory_hostname }}"
      - --node-address
      - "{{ promoted_node_address }}"
      - --service-port
      - "{{ promoted_service_port | string }}"
      - --journal
      - "{{ promoted_config_directory }}/promotion.json"
      - --config-dir
      - "{{ promoted_config_directory }}"
  environment:
    PYTHONPATH: "{{ '/opt/todo/lib' if app_installer_fapolicyd.rc == 0 else app_installer_target ~ '/deploy/installer' }}"
    PYTHONDONTWRITEBYTECODE: "1"
  register: promoted_deployment
  changed_when: (promoted_deployment.stdout | from_json).changed

- name: Report successful promoted application deployment
  ansible.builtin.debug:
    msg: >-
      All registered applications are healthy through the shared proxy and identity provider.
      Every database was already promoted; only application init migrations ran.
      No database-role bootstrap ran.
