---
# Compatibility entry point. Use the Python CLI for interactive secret creation.
- name: Deploy the single-host Todo workload with Python
  hosts: todo_hosts
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/../../.."
    deployment_mode: build
    bundle_directory: ""
    refresh_images: false
    todo_quadlet_directory: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/containers/systemd"
    todo_kube_runtime_directory: "{{ todo_quadlet_directory }}/todo-kube-runtime"
    todo_publish_address: 127.0.0.1
    todo_service_port: 8443
  tasks:
    - name: Install through the shared Python implementation
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '-m', 'todo_installer', 'install', '--mode', 'server',
              '--project-root', project_root, '--deployment-mode', deployment_mode,
              '--bundle-dir', bundle_directory, '--quadlet-dir', todo_quadlet_directory,
              '--kube-runtime-dir', todo_kube_runtime_directory,
              '--publish-address', todo_publish_address,
              '--service-port', todo_service_port | string]
             + (['--refresh-images'] if refresh_images | bool else []) }}
      environment:
        PYTHONPATH: "{{ project_root }}/deploy/installer"
        PYTHONDONTWRITEBYTECODE: "1"
      changed_when: true
