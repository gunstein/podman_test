---
- name: Verify root access before any standby rebuild changes
  hosts: todo_rebuild_standby
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Verify root access on the Ansible controller
      ansible.builtin.command: /usr/bin/true
      become: true
      become_user: root
      delegate_to: localhost
      changed_when: false

    - name: Verify root access on the rebuild host
      ansible.builtin.command: /usr/bin/true
      become: true
      become_user: root
      changed_when: false

- name: Run the destructive standby rebuild preflight
  ansible.builtin.import_playbook: preflight-standby-rebuild.yml

- name: Prepare promoted database for a rebuilt standby
  hosts: todo_current_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."
    todo_rendered_manifest_directory: "{{ project_root }}/generated/kube-runtime"
    rebuild_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    rebuild_config_directory: "{{ rebuild_user_home }}/.config/todo"
    rebuild_quadlet_directory: "{{ rebuild_user_home }}/.config/containers/systemd"

  roles:
    - role: postgres_redundancy_primary

- name: Destroy old primary data and rebuild it as standby
  hosts: todo_rebuild_standby
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."
    todo_rendered_manifest_directory: "{{ project_root }}/generated/kube-runtime"
    rebuild_user_home: '{{ todo_user_home | default("/home/" ~ ansible_user) }}'
    rebuild_config_directory: "{{ rebuild_user_home }}/.config/todo"
    rebuild_quadlet_directory: "{{ rebuild_user_home }}/.config/containers/systemd"

  roles:
    - role: postgres_reseed_standby
    - role: todo_dr
      vars:
        todo_dr_config_directory: "{{ rebuild_config_directory }}"
        todo_dr_primary_group: todo_current_primary
        todo_dr_standby_group: todo_rebuild_standby

- name: Verify restored replication
  hosts: todo_current_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Resolve the complete registered replication group
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/read-replication-registry.yml"

    - name: Wait for each rebuilt standby to reach streaming state
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replicate-workload.yml"
      loop: "{{ todo_replication_metadata }}"
      loop_control:
        loop_var: todo_replication_app_meta
        label: "{{ todo_replication_app_meta.name }}"
      vars:
        todo_replication_app: "{{ todo_replication_app_meta.name }}"
        todo_replication_operation: streaming
        todo_replication_rebuilt: true

    - name: Report restored database redundancy
      ansible.builtin.debug:
        msg: >-
          Restored asynchronous redundancy for every registered database.
          The promoted host remains primary; the old primary is now a rebuilt standby.
