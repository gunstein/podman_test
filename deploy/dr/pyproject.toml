# Only for tooling: the DR host package is staged onto hosts by app-ops, never installed with pip.

# Mutation testing (a CI-only tool; see docs/MUTATION-TESTING.md).
[tool.mutmut]
source_paths = ["app_dr_host"]
only_mutate = ["app_dr_host/replication.py"]
pytest_add_cli_args_test_selection = ["tests/test_replication.py", "tests/test_destructive_gates.py",
                                      "tests/test_replication_checks.py"]
