name: Clean install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-syntax:
    name: M13 syntax (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: "3.11"
            ansible: "2.14.18"
          - python: "3.12"
            ansible: "2.20.8"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "${{ matrix.python }}"

      - name: Install Ansible Core
        run: python -m pip install "ansible-core==${{ matrix.ansible }}"

      - name: Syntax-check M13 playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            ansible/preflight-m13.yml \
            ansible/sync-standby-secrets.yml \
            ansible/bootstrap-m13.yml \
            ansible/status-m13.yml
          do
            ansible-playbook \
              --inventory ansible/inventory-m13.example.ini \
              "$playbook" \
              --syntax-check
          done

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Exercise clean role setup and migrations
        shell: bash
        run: |
          set -euo pipefail
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          printf '%s' 'ci-only-not-a-secret' > "$secrets_directory/todo-db-password"
          printf '%s' 'ci-migrator-not-a-secret' > "$secrets_directory/todo-migrator-password"
          printf '%s' 'ci-app-not-a-secret' > "$secrets_directory/todo-app-password"
          printf '%s' 'ci-keycloak-not-a-secret' > "$secrets_directory/todo-keycloak-db-password"

          export DATABASE_HOST=127.0.0.1
          export DATABASE_NAME=todo_test
          export DATABASE_BOOTSTRAP_USER=todo
          export DATABASE_SECRETS_DIRECTORY="$secrets_directory"
          python -m backend.setup_roles

          export DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m backend.migrate up
          unset DATABASE_URL
          python -m backend.setup_roles

          python - <<'PY'
          import psycopg
          from psycopg.errors import InsufficientPrivilege

          base = "host=127.0.0.1 dbname=todo_test"
          roles = {
              "todo_app": f"{base} user=todo_app password=ci-app-not-a-secret",
              "todo_migrator": (
                  f"{base} user=todo_migrator password=ci-migrator-not-a-secret"
              ),
              "keycloak_app": (
                  f"{base} user=keycloak_app password=ci-keycloak-not-a-secret"
              ),
          }

          def expect_allowed(role, query):
              with psycopg.connect(roles[role]) as connection:
                  connection.execute(query)

          def expect_denied(role, query):
              with psycopg.connect(roles[role]) as connection:
                  try:
                      connection.execute(query)
                  except InsufficientPrivilege:
                      return
                  else:
                      raise RuntimeError(f"{role} unexpectedly ran: {query}")

          with psycopg.connect(roles["keycloak_app"]) as connection:
              connection.execute(
                  "CREATE TABLE keycloak.privilege_probe (id integer)"
              )

          expect_allowed("todo_app", "SELECT id, title, completed FROM todos")
          expect_denied("todo_app", "SELECT version FROM schema_migrations")
          expect_denied("todo_app", "SELECT id FROM keycloak.privilege_probe")

          expect_allowed("todo_migrator", "SELECT version FROM schema_migrations")
          expect_denied(
              "todo_migrator", "SELECT id FROM keycloak.privilege_probe"
          )

          expect_allowed(
              "keycloak_app", "SELECT id FROM keycloak.privilege_probe"
          )
          expect_denied("keycloak_app", "SELECT id FROM public.todos")
          PY

          export TEST_DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m pytest backend/tests
