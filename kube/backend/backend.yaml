apiVersion: v1
kind: Pod
metadata:
  name: todo-kube-backend
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: backend
  annotations:
    io.podman.annotations.pids-limit/backend: "128"
spec:
  restartPolicy: Never
  containers:
    - name: backend
      image: localhost/todo-backend:m12
      imagePullPolicy: Never
      ports:
        - name: http
          containerPort: 8000
      envFrom:
        - configMapRef:
            name: todo-backend-config
            optional: false
      env:
        - name: DATABASE_PASSWORD_FILE
          value: /run/secrets/todo-backend/database-password
      volumeMounts:
        - name: backend-secret
          mountPath: /run/secrets/todo-backend
          readOnly: true
      livenessProbe:
        exec:
          command:
            - python
            - -c
            - >-
              import socket;
              socket.create_connection(("127.0.0.1", 8000), 1).close()
        initialDelaySeconds: 2
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      resources:
        limits:
          memory: 256Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  volumes:
    - name: backend-secret
      secret:
        secretName: todo-kube-backend-secret
        optional: false
        defaultMode: 0444
