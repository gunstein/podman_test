---
- name: Resolve and stage the complete replication group for the operator tool
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replication-apps.yml"

- name: Install and trust the Todo DR tools
  ansible.builtin.include_role:
    name: todo_fapolicyd
  vars:
    todo_fapolicyd_files:
      - source: "{{ project_root }}/deploy/scripts/app_dr.py"
        dest: /opt/todo/bin/app_dr.py
        mode: "0644"

# app_dr.py owns its configuration format: the same code writes and reads it.
- name: Write the local Todo DR configuration
  ansible.builtin.command:
    argv:
      - python3
      - /opt/todo/bin/app_dr.py
      - --config
      - "{{ todo_dr_config_directory }}/todo-dr.json"
      - configure
      - --primary-name
      - "{{ groups[todo_dr_primary_group | default('todo_primary')][0] }}"
      - --primary-address
      - "{{ hostvars[groups[todo_dr_primary_group | default('todo_primary')][0]].todo_node_address }}"
      - --standby-name
      - "{{ groups[todo_dr_standby_group | default('todo_standby')][0] }}"
      - --rpo-target-seconds
      - "{{ todo_rpo_target_seconds | default(todo_rpo_seconds | default(30)) | string }}"
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  register: todo_dr_config_install
  changed_when: (todo_dr_config_install.stdout | from_json).changed
