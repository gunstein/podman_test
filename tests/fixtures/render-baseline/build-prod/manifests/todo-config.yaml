apiVersion: v1
kind: ConfigMap
metadata:
  name: "todo-postgres-config"
data:
  POSTGRES_DB: "todo"
  POSTGRES_USER: "todo"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "todo-backend-config"
data:
  DATABASE_HOST: "todo-postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "todo"
  LOG_LEVEL: "info"
  OIDC_ISSUER: "https://todo.test:8443/auth/realms/todo"
  OIDC_JWKS_URL: http://keycloak:8080/auth/realms/todo/protocol/openid-connect/certs
  OIDC_AUDIENCE: "todo-frontend"
