apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-kube-postgres-data
  annotations:
    volume.podman.io/uid: "999"
    volume.podman.io/gid: "999"
---
apiVersion: v1
kind: Pod
metadata:
  name: todo-kube-postgres
  labels:
    app.kubernetes.io/name: todo
    app.kubernetes.io/component: database
  annotations:
    io.podman.annotations.pids-limit/postgres: "256"
spec:
  restartPolicy: Never
  containers:
    - name: postgres
      image: docker.io/library/postgres:17.11
      imagePullPolicy: Never
      ports:
        - name: postgres
          containerPort: 5432
      envFrom:
        - configMapRef:
            name: todo-postgres-config
            optional: false
      env:
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/todo-kube-postgres/database-password
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-secret
          mountPath: /run/secrets/todo-kube-postgres
          readOnly: true
      livenessProbe:
        exec:
          command:
            - pg_isready
            - --username
            - todo
            - --dbname
            - todo
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      resources:
        limits:
          memory: 512Mi
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: todo-kube-postgres-data
    - name: postgres-secret
      secret:
        secretName: todo-kube-postgres-secret
        optional: false
        defaultMode: 0444
