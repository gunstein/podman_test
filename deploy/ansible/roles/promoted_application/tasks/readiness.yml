---
- name: Wait for backend health through the selected nginx virtual host
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/health
    headers:
      Host: "{{ promoted_app.hostname }}"
    return_content: true
  register: promoted_health
  until: promoted_health.status == 200 and promoted_health.json.status == 'ok'
  retries: 30
  delay: 1

- name: Wait for database readiness through the selected nginx virtual host
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/ready
    headers:
      Host: "{{ promoted_app.hostname }}"
    return_content: true
  register: promoted_readiness
  until: promoted_readiness.status == 200 and promoted_readiness.json.status == 'ready'
  retries: 30
  delay: 1

- name: Verify public application reads through the selected nginx virtual host
  ansible.builtin.uri:
    url: "{{ 'http://127.0.0.1:8080' ~ promoted_app.api_path }}"
    headers:
      Host: "{{ promoted_app.hostname }}"
    return_content: true
    status_code: 200
  register: promoted_public_reads
  failed_when: promoted_public_reads.json is not sequence
