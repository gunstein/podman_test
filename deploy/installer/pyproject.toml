[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-installer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jinja2"]

[project.optional-dependencies]
dr = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["todo_installer*"]
