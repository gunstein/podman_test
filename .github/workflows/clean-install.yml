name: Clean install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-syntax:
    name: Ansible syntax matrix (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: "3.9"
            ansible: "2.14.18"
          - python: "3.12"
            ansible: "2.20.8"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "${{ matrix.python }}"

      - name: Install Ansible Core
        run: >-
          python -m pip install
          "ansible-core==${{ matrix.ansible }}"

      - name: Syntax-check single-host playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            deploy/ansible/playbooks/deploy.yml \
            deploy/ansible/playbooks/uninstall.yml
          do
            ansible-playbook \
              --inventory deploy/ansible/inventories/local/hosts.ini \
              "$playbook" \
              --syntax-check
          done

      - name: Syntax-check initial standby playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            deploy/ansible/playbooks/preflight-standby.yml \
            deploy/ansible/playbooks/sync-standby-secrets.yml \
            deploy/ansible/playbooks/bootstrap-standby.yml \
            deploy/ansible/playbooks/install-dr-tool.yml \
            deploy/ansible/playbooks/install-quarantine-tool.yml \
            deploy/ansible/playbooks/replication-status.yml
          do
            ansible-playbook \
              --inventory deploy/ansible/inventories/initial/hosts.example.ini \
              "$playbook" \
              --syntax-check
          done

      - name: Syntax-check promoted application playbook
        run: >-
          ansible-playbook
          --inventory deploy/ansible/inventories/recovery/hosts.example.ini
          deploy/ansible/playbooks/deploy-promoted-application.yml
          --syntax-check

      - name: Syntax-check backup playbook
        run: >-
          ansible-playbook
          --inventory deploy/ansible/inventories/recovery/hosts.example.ini
          deploy/ansible/playbooks/configure-backup.yml
          --syntax-check

      - name: Syntax-check standby rebuild playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            deploy/ansible/playbooks/preflight-standby-rebuild.yml \
            deploy/ansible/playbooks/rebuild-standby.yml \
            deploy/ansible/playbooks/cluster-status.yml
          do
            ansible-playbook \
              --inventory deploy/ansible/inventories/recovery/hosts.example.ini \
              "$playbook" \
              --syntax-check
          done

      - name: Test DR and backup tools
        run: python -m unittest discover --start-directory tests --verbose
      - name: Build and verify the operations package
        shell: bash
        run: |
          set -euo pipefail
          deploy/scripts/build-operations-package.sh
          (
            cd dist
            sha256sum -c todo-operations.tar.gz.sha256
          )
          archive=dist/todo-operations.tar.gz
          for required in \
            todo-operations/ansible.cfg \
            todo-operations/deploy/ansible/inventories/initial/hosts.example.ini \
            todo-operations/deploy/ansible/inventories/recovery/hosts.example.ini \
            todo-operations/deploy/ansible/playbooks/deploy-promoted-application.yml \
            todo-operations/deploy/ansible/playbooks/configure-backup.yml \
            todo-operations/deploy/ansible/playbooks/rebuild-standby.yml \
            todo-operations/deploy/ansible/roles/promoted_application/tasks/main.yml \
            todo-operations/deploy/ansible/roles/postgres_backup/tasks/main.yml \
            todo-operations/deploy/scripts/todo_dr.py \
            todo-operations/deploy/scripts/todo_backup.py \
            todo-operations/deploy/offline/FAPOLICYD.md \
            todo-operations/docs/SECRETS.md \
            todo-operations/docs/TLS.md \
            todo-operations/VERSION
          do
            tar -tzf "$archive" | grep -Fx "$required" >/dev/null
          done
          version=$(tar -xOf "$archive" todo-operations/VERSION)
          grep -Fx "package=todo-operations" <<<"$version" >/dev/null
          grep -Eq "^source_revision=[0-9a-f]{40}$" <<<"$version"
          grep -Fx "source_state=clean" <<<"$version" >/dev/null


  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned Ansible tooling
        run: >-
          python -m pip install
          "ansible-core==2.20.8"
          "ansible-lint==26.8.0"

      - name: Lint Ansible content
        run: ansible-lint deploy/ansible

  script-quality:
    name: Scripts and nginx smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned script tooling
        run: python -m pip install "ruff==0.16.5" "shellcheck-py==0.11.0.1" "PyYAML==6.0.3" jinja2

      - name: Lint Python
        run: ruff check todo-backend notes-backend e2e deploy/scripts deploy/installer tests

      - name: Test frontend authentication adapter in Chromium
        run: |
          python -m pip install -r todo-backend/requirements-e2e.txt
          python -m playwright install --with-deps chromium
          python -m pytest e2e/test_auth_adapter.py --browser chromium -q

      - name: Lint shell scripts
        shell: bash
        run: |
          shellcheck \
            deploy/offline/build-bundle.sh \
            deploy/offline/install.sh \
            deploy/offline/preflight.sh \
            proxy/proxy-entrypoint.sh \
            deploy/scripts/build-operations-package.sh \
            deploy/scripts/render-kube-runtime.sh \
            deploy/scripts/dev-up.sh \
            deploy/scripts/dev-down.sh \
            deploy/scripts/smoke-proxy.sh \
            deploy/scripts/run-e2e.sh \
            deploy/scripts/todo-quarantine.sh \
            deploy/scripts/trust-serving-ca.sh \
            deploy/scripts/bootstrap-ssh-key.sh

      - name: Prepare rootless Podman for smoke test
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

      - name: Smoke-test nginx and TLS bootstrap
        run: deploy/scripts/smoke-proxy.sh


  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

      notes-postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: notes_test
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: todo-backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r todo-backend/requirements-test.txt

      - name: Test migration startup retry
        run: python -m unittest discover --start-directory todo-backend/unit_tests --verbose

      - name: Test Notes CRUD, audience isolation and migration retry
        run: python -m unittest discover --start-directory notes-backend/unit_tests --verbose

      - name: Exercise clean role setup and migrations
        shell: bash
        run: |
          set -euo pipefail
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          printf '%s' 'ci-only-not-a-secret' > "$secrets_directory/todo-db-password"
          printf '%s' 'ci-migrator-not-a-secret' > "$secrets_directory/todo-migrator-password"
          printf '%s' 'ci-app-not-a-secret' > "$secrets_directory/todo-app-password"

          export DATABASE_HOST=127.0.0.1
          export DATABASE_NAME=todo_test
          export DATABASE_BOOTSTRAP_USER=todo
          export DATABASE_SECRETS_DIRECTORY="$secrets_directory"
          python -m todo-backend.setup_roles

          export DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m todo-backend.migrate up
          unset DATABASE_URL
          python -m todo-backend.setup_roles

          python - <<'PY'
          import psycopg
          from psycopg.errors import InsufficientPrivilege

          base = "host=127.0.0.1 dbname=todo_test"
          roles = {
              "todo_app": f"{base} user=todo_app password=ci-app-not-a-secret",
              "todo_migrator": (
                  f"{base} user=todo_migrator password=ci-migrator-not-a-secret"
              ),
          }

          def expect_allowed(role, query):
              with psycopg.connect(roles[role]) as connection:
                  connection.execute(query)

          def expect_denied(role, query):
              with psycopg.connect(roles[role]) as connection:
                  try:
                      connection.execute(query)
                  except InsufficientPrivilege:
                      return
                  else:
                      raise RuntimeError(f"{role} unexpectedly ran: {query}")

          expect_allowed("todo_app", "SELECT id, title, completed FROM todos")
          expect_denied("todo_app", "SELECT version FROM schema_migrations")

          expect_allowed("todo_migrator", "SELECT version FROM schema_migrations")
          PY

          export TEST_DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m pytest todo-backend/tests

      - name: Exercise Notes bootstrap, migrations and runtime privileges
        shell: bash
        run: |
          set -euo pipefail
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          printf '%s' 'ci-only-not-a-secret' > "$secrets_directory/notes-db-password"
          printf '%s' 'ci-notes-migrator-not-a-secret' > "$secrets_directory/notes-migrator-password"
          printf '%s' 'ci-notes-app-not-a-secret' > "$secrets_directory/notes-app-password"
          export DATABASE_HOST=127.0.0.1 DATABASE_PORT=5433 DATABASE_NAME=notes_test
          export DATABASE_BOOTSTRAP_USER=notes DATABASE_SECRETS_DIRECTORY="$secrets_directory"
          python -m notes-backend.setup_roles
          export DATABASE_URL='host=127.0.0.1 port=5433 dbname=notes_test user=notes_migrator password=ci-notes-migrator-not-a-secret'
          python -m notes-backend.migrate up
          unset DATABASE_URL
          python -m notes-backend.setup_roles
          export DATABASE_USER=notes_app DATABASE_PASSWORD_FILE="$secrets_directory/notes-app-password"
          NOTES_ROLE_TEST=1 python -m unittest discover --start-directory notes-backend/tests --verbose
