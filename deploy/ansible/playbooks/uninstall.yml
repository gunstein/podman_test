---
- name: Uninstall the single-host Todo workload with Python
  hosts: todo_hosts
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/../../.."
    quadlet_directory: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/containers/systemd"
    remove_data: false
  tasks:
    - name: Uninstall through the guarded Python implementation
      ansible.builtin.command:
        argv: >-
          {{ ['python3', '-m', 'app_installer', 'uninstall',
              '--quadlet-dir', quadlet_directory]
             + (['--remove-data'] if remove_data | bool else []) }}
      environment:
        PYTHONPATH: "{{ project_root }}/deploy/installer"
        PYTHONDONTWRITEBYTECODE: "1"
      register: todo_uninstall_result
      changed_when: (todo_uninstall_result.stdout | from_json).changed
