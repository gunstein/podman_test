apiVersion: v1
kind: ConfigMap
metadata:
  name: "notes-postgres-config"
data:
  POSTGRES_DB: "notes"
  POSTGRES_USER: "notes"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "notes-backend-config"
data:
  DATABASE_HOST: "notes-postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "notes"
  LOG_LEVEL: "info"
  OIDC_ISSUER: "https://auth.test:8443/auth/realms/todo"
  OIDC_JWKS_URL: http://keycloak:8080/auth/realms/todo/protocol/openid-connect/certs
  OIDC_AUDIENCE: "notes-frontend"
