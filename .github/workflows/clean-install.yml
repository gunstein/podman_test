name: Clean install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-syntax:
    name: M12-M16 syntax (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: "3.9"
            ansible: "2.14.18"
          - python: "3.12"
            ansible: "2.20.8"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "${{ matrix.python }}"

      - name: Install Ansible Core
        run: >-
          python -m pip install
          "ansible-core==${{ matrix.ansible }}"
          "tomli==2.2.1; python_version < '3.11'"

      - name: Syntax-check M12 playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            ansible/deploy.yml \
            ansible/uninstall.yml
          do
            ansible-playbook \
              --inventory ansible/inventory.ini \
              "$playbook" \
              --syntax-check
          done

      - name: Syntax-check initial standby playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            ansible/preflight-standby.yml \
            ansible/sync-standby-secrets.yml \
            ansible/bootstrap-standby.yml \
            ansible/install-dr-tool.yml \
            ansible/install-quarantine-tool.yml \
            ansible/replication-status.yml
          do
            ansible-playbook \
              --inventory ansible/inventory-initial.example.ini \
              "$playbook" \
              --syntax-check
          done

      - name: Syntax-check promoted application playbook
        run: >-
          ansible-playbook
          --inventory ansible/inventory-recovery.example.ini
          ansible/deploy-promoted-application.yml
          --syntax-check

      - name: Syntax-check backup playbook
        run: >-
          ansible-playbook
          --inventory ansible/inventory-recovery.example.ini
          ansible/configure-backup.yml
          --syntax-check

      - name: Syntax-check standby rebuild playbooks
        shell: bash
        run: |
          set -euo pipefail
          for playbook in \
            ansible/preflight-standby-rebuild.yml \
            ansible/rebuild-standby.yml \
            ansible/cluster-status.yml
          do
            ansible-playbook \
              --inventory ansible/inventory-recovery.example.ini \
              "$playbook" \
              --syntax-check
          done

      - name: Test DR and backup tools
        run: python -m unittest discover --start-directory tests --verbose
      - name: Build and verify the operations package
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-operations-package.sh
          (
            cd dist
            sha256sum -c todo-operations.tar.gz.sha256
          )
          archive=dist/todo-operations.tar.gz
          for required in \
            todo-operations/ansible.cfg \
            todo-operations/ansible/inventory-initial.example.ini \
            todo-operations/ansible/inventory-recovery.example.ini \
            todo-operations/ansible/deploy-promoted-application.yml \
            todo-operations/ansible/configure-backup.yml \
            todo-operations/ansible/rebuild-standby.yml \
            todo-operations/ansible/roles/promoted_application/tasks/main.yml \
            todo-operations/ansible/roles/postgres_backup/tasks/main.yml \
            todo-operations/scripts/todo_dr.py \
            todo-operations/scripts/todo_backup.py \
            todo-operations/offline/FAPOLICYD.md \
            todo-operations/docs/SECRETS.md \
            todo-operations/docs/TLS.md \
            todo-operations/VERSION
          do
            tar -tzf "$archive" | grep -Fx "$required" >/dev/null
          done
          version=$(tar -xOf "$archive" todo-operations/VERSION)
          grep -Fx "package=todo-operations" <<<"$version" >/dev/null
          grep -Eq "^source_revision=[0-9a-f]{40}$" <<<"$version"
          grep -Fx "source_state=clean" <<<"$version" >/dev/null


  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned Ansible tooling
        run: >-
          python -m pip install
          "ansible-core==2.20.8"
          "ansible-lint==26.8.0"

      - name: Lint Ansible content
        run: ansible-lint ansible

  script-quality:
    name: Scripts and nginx smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned script tooling
        run: python -m pip install "ruff==0.16.5" "shellcheck-py==0.11.0.1"

      - name: Install verified Helm renderer
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/helm.tar.gz \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          echo "c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3  /tmp/helm.tar.gz" |
            sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp

      - name: Verify generated Kube runtime
        shell: bash
        run: |
          HELM=/tmp/linux-amd64/helm scripts/render-kube-runtime.sh \
            helm/todo/values-prod.yaml /tmp/rendered
          diff -ru /tmp/rendered/app.yaml kube/runtime/app.yaml
          diff -ru /tmp/rendered/keycloak.yaml kube/runtime/keycloak.yaml
          diff -ru /tmp/rendered/postgres.yaml kube/runtime/postgres.yaml
          diff -ru /tmp/rendered/config.yaml kube/runtime/config.yaml

      - name: Lint Python
        run: ruff check backend e2e scripts tests

      - name: Lint shell scripts
        shell: bash
        run: |
          shellcheck \
            offline/build-bundle.sh \
            offline/install.sh \
            offline/preflight.sh \
            frontend/todo-nginx-entrypoint.sh \
            scripts/build-operations-package.sh \
            scripts/render-kube-runtime.sh \
            scripts/dev-up.sh \
            scripts/dev-down.sh \
            scripts/run-e2e.sh

      - name: Smoke-test nginx and TLS bootstrap
        shell: bash
        run: |
          set -euo pipefail
          image="todo-frontend-ci:${GITHUB_SHA}"
          volume="todo-nginx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm --force "$volume" >/dev/null 2>&1 || true' EXIT

          docker build \
            --file frontend/Containerfile \
            --tag "$image" \
            .
          docker volume create "$volume" >/dev/null
          docker run --rm \
            --user root \
            --volume "$volume:/var/lib/todo-tls" \
            --entrypoint chown \
            "$image" \
            nginx:nginx /var/lib/todo-tls
          docker run --rm \
            --add-host todo-backend:127.0.0.1 \
            --add-host todo-keycloak:127.0.0.1 \
            --env TODO_TLS_HOSTNAME=todo.test \
            --volume "$volume:/var/lib/todo-tls" \
            "$image" \
            nginx -t
          docker run --rm \
            --volume "$volume:/var/lib/todo-tls:ro" \
            --entrypoint sh \
            "$image" \
            -ec '
              openssl x509 -in /var/lib/todo-tls/server.crt \
                -noout -checkhost todo.test
              openssl verify \
                -CAfile /var/lib/todo-tls/ca.crt \
                /var/lib/todo-tls/server.crt
              test "$(stat -c "%a" /var/lib/todo-tls/ca.key)" = 600
              test "$(stat -c "%a" /var/lib/todo-tls/server.key)" = 600
            '


  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt

      - name: Test migration startup retry
        run: python -m unittest discover --start-directory backend/unit_tests --verbose

      - name: Exercise clean role setup and migrations
        shell: bash
        run: |
          set -euo pipefail
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          printf '%s' 'ci-only-not-a-secret' > "$secrets_directory/todo-db-password"
          printf '%s' 'ci-migrator-not-a-secret' > "$secrets_directory/todo-migrator-password"
          printf '%s' 'ci-app-not-a-secret' > "$secrets_directory/todo-app-password"
          printf '%s' 'ci-keycloak-not-a-secret' > "$secrets_directory/todo-keycloak-db-password"

          export DATABASE_HOST=127.0.0.1
          export DATABASE_NAME=todo_test
          export DATABASE_BOOTSTRAP_USER=todo
          export DATABASE_SECRETS_DIRECTORY="$secrets_directory"
          python -m backend.setup_roles

          export DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m backend.migrate up
          unset DATABASE_URL
          python -m backend.setup_roles

          python - <<'PY'
          import psycopg
          from psycopg.errors import InsufficientPrivilege

          base = "host=127.0.0.1 dbname=todo_test"
          roles = {
              "todo_app": f"{base} user=todo_app password=ci-app-not-a-secret",
              "todo_migrator": (
                  f"{base} user=todo_migrator password=ci-migrator-not-a-secret"
              ),
              "keycloak_app": (
                  f"{base} user=keycloak_app password=ci-keycloak-not-a-secret"
              ),
          }

          def expect_allowed(role, query):
              with psycopg.connect(roles[role]) as connection:
                  connection.execute(query)

          def expect_denied(role, query):
              with psycopg.connect(roles[role]) as connection:
                  try:
                      connection.execute(query)
                  except InsufficientPrivilege:
                      return
                  else:
                      raise RuntimeError(f"{role} unexpectedly ran: {query}")

          with psycopg.connect(roles["keycloak_app"]) as connection:
              connection.execute(
                  "CREATE TABLE keycloak.privilege_probe (id integer)"
              )

          expect_allowed("todo_app", "SELECT id, title, completed FROM todos")
          expect_denied("todo_app", "SELECT version FROM schema_migrations")
          expect_denied("todo_app", "SELECT id FROM keycloak.privilege_probe")

          expect_allowed("todo_migrator", "SELECT version FROM schema_migrations")
          expect_denied(
              "todo_migrator", "SELECT id FROM keycloak.privilege_probe"
          )

          expect_allowed(
              "keycloak_app", "SELECT id FROM keycloak.privilege_probe"
          )
          expect_denied("keycloak_app", "SELECT id FROM public.todos")
          PY

          export TEST_DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m pytest backend/tests
