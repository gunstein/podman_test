name: Clean install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests and operations package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.9 is the Oracle Linux 9 system Python on the hosts.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "${{ matrix.python }}"

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3" jinja2

      # tests/ also runs the package suites: tests/test_installer.py loads the
      # installer tests from deploy/installer/tests and tests/test_dr_host.py
      # the DR host tests from deploy/dr/tests (load_tests). The operations
      # package smoke test, which unpacks the tarball and starts app_ops,
      # app_dr_host, app_dr.py and app_backup.py, is tests/test_operations_distribution.py.
      - name: "Python tests: installer, DR, app-ops, acceptance tool and packages"
        run: python -m unittest discover --start-directory tests --verbose
      # E4: line and branch coverage of the same suites, to follow up missing
      # branches that matter. Information only, not a gate; once, on 3.12.
      - name: Coverage report (information, not a gate)
        if: matrix.python == '3.12'
        run: |
          python -m pip install "coverage==7.16.2"
          python -m coverage run --branch \
            --source=deploy/installer/app_installer,deploy/dr/app_dr_host,deploy/dr/app_ops,deploy/dr/scripts,deploy/scripts/lab \
            -m unittest discover --start-directory tests > /dev/null 2>&1
          python -m coverage report --sort=cover
      - name: Build and verify the operations package
        shell: bash
        run: |
          set -euo pipefail
          deploy/scripts/build-operations-package.sh
          (
            cd dist
            sha256sum -c platform-operations.tar.gz.sha256
          )
          archive=dist/platform-operations.tar.gz
          for required in \
            platform-operations/deploy/dr/app_ops/cli.py \
            platform-operations/deploy/dr/app_dr_host/cli.py \
            platform-operations/deploy/dr/README.md \
            platform-operations/deploy/installer/app_installer/cli.py \
            platform-operations/deploy/dr/scripts/app_dr.py \
            platform-operations/deploy/dr/scripts/app_backup.py \
            platform-operations/deploy/scripts/wait-ready.sh \
            platform-operations/deploy/offline/FAPOLICYD.md \
            platform-operations/docs/SECRETS.md \
            platform-operations/docs/TLS.md \
            platform-operations/VERSION
          do
            tar -tzf "$archive" | grep -Fx "$required" >/dev/null
          done
          version=$(tar -xOf "$archive" platform-operations/VERSION)
          grep -Fx "package=platform-operations" <<<"$version" >/dev/null
          grep -Eq "^source_revision=[0-9a-f]{40}$" <<<"$version"
          grep -Fx "source_state=clean" <<<"$version" >/dev/null


  script-quality:
    name: Scripts and nginx smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned script tooling
        run: python -m pip install "ruff==0.16.5" "pyright==1.1.414" "shellcheck-py==0.11.0.1" "PyYAML==6.0.3" jinja2

      - name: Lint Python
        run: ruff check todo-backend notes-backend e2e deploy/scripts deploy/installer deploy/dr tests

      # Calls with the wrong arguments across modules, which ruff (one file at a
      # time) cannot see; the scope and basic mode are in pyrightconfig.json.
      - name: Type-check the installer, DR and scripts
        run: pyright

      - name: Test frontend authentication adapter and marker helper in Chromium
        run: |
          python -m pip install -r todo-backend/requirements-e2e.txt
          python -m playwright install --with-deps chromium
          python -m pytest e2e/test_auth_adapter.py e2e/test_create_markers.py --browser chromium -q

      - name: Lint shell scripts
        shell: bash
        run: |
          shellcheck \
            deploy/offline/build-bundle.sh \
            deploy/offline/install.sh \
            deploy/offline/preflight.sh \
            proxy/proxy-entrypoint.sh \
            deploy/scripts/build-operations-package.sh \
            deploy/scripts/render-kube-runtime.sh \
            deploy/scripts/dev/dev-up.sh \
            deploy/scripts/dev/dev-down.sh \
            deploy/scripts/dev/smoke-proxy.sh \
            deploy/scripts/dev/run-e2e.sh \
            deploy/dr/scripts/app-quarantine.sh \
            deploy/scripts/trust-files.sh \
            deploy/scripts/platform-ca-sign \
            deploy/scripts/lab/trust-serving-ca.sh \
            deploy/scripts/lab/helpers.sh \
            deploy/scripts/lab/provision-user.sh \
            deploy/dr/scripts/bootstrap-ssh-key.sh \
            deploy/scripts/wait-ready.sh \
            deploy/scripts/dev/run-mutation-tests.sh

      - name: Prepare rootless Podman for smoke test
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

      - name: Smoke-test nginx and TLS bootstrap
        run: deploy/scripts/dev/smoke-proxy.sh


  full-stack:
    # The seven pods from source with dev-up.sh on the runner's rootless Podman,
    # then the lab's browser tests: a real Keycloak login and a write and read in
    # each app through nginx, with TLS errors fatal. Run 10's CSP error would
    # have failed here.
    # ubuntu-26.04: the installer needs podman kube play --no-pod-prefix (Podman
    # 5); ubuntu-latest still has Podman 4.9.
    name: Full stack in rootless Podman
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install tools, Chromium and the demo hostnames
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "PyYAML==6.0.3" jinja2 -r todo-backend/requirements-e2e.txt
          python -m playwright install --with-deps chromium
          command -v certutil >/dev/null || { sudo apt-get update; sudo apt-get install -y libnss3-tools; }
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          # The development stack's hostnames, from platform.yaml (its local environment).
          echo "127.0.0.1 $(PYTHONPATH=deploy/installer python -m app_installer platform hostnames --environment local)" |
            sudo tee -a /etc/hosts

      - name: Start the stack with dev-up.sh
        run: deploy/scripts/dev/dev-up.sh

      - name: failover's login-page check against the real Keycloak and nginx
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=deploy/installer:deploy/dr python deploy/scripts/dev/check_failover_login_page.py

      - name: Browser tests through nginx with a real Keycloak login
        shell: bash
        run: |
          set -euo pipefail
          ca_file=$(mktemp)
          podman exec nginx cat /var/lib/platform-tls/ca.crt > "$ca_file"
          mkdir -p ~/.pki/nssdb
          certutil -N -d sql:"$HOME/.pki/nssdb" --empty-password
          certutil -A -d sql:"$HOME/.pki/nssdb" -n platform-ci-ca -t 'C,,' -i "$ca_file"
          E2E_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          KEYCLOAK_ADMIN_PASSWORD=$(PYTHONPATH=deploy/installer python -c \
            'from app_installer import apps, secrets; print(secrets.read(apps.KEYCLOAK_ADMIN_SECRET))')
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$KEYCLOAK_ADMIN_PASSWORD"
          export E2E_PASSWORD KEYCLOAK_ADMIN_PASSWORD E2E_USERNAME=testuser E2E_IGNORE_HTTPS_ERRORS=false
          python e2e/provision_user.py
          origin() {  # an app's origin on the development stack: platform.yaml's local environment
            local platform=(env PYTHONPATH=deploy/installer python -m app_installer platform)
            echo "https://$("${platform[@]}" hostname "$1" --environment local):$("${platform[@]}" public-port --environment local)"
          }
          E2E_BASE_URL=$(origin todo) python -m pytest e2e/test_todo_flow.py --browser chromium -rs
          E2E_NOTES_URL=$(origin notes) python -m pytest e2e/test_notes_flow.py --browser chromium -rs
          E2E_MULTI_APP=1 E2E_CA_FILE="$ca_file" python -m pytest e2e/test_multi_app.py -rs

      - name: Show pods and logs on failure
        if: failure()
        run: |
          podman pod ps
          podman ps --all
          for container in $(podman ps --all --format '{{.Names}}'); do
            echo "::group::$container"
            podman logs --tail 80 "$container" || true
            echo "::endgroup::"
          done

      - name: Stop the stack with dev-down.sh
        if: always()
        run: deploy/scripts/dev/dev-down.sh

      # V1: kube play copies each mounted Kube secret, passwords and nginx's key,
      # into a volume called after it; dev-down must leave no pod and none of
      # those volumes (the data volumes stay, by design).
      - name: dev-down leaves no pod and no Kube secret volume
        run: |
          set -euo pipefail
          podman volume ls --format '{{.Name}}'
          test -z "$(podman pod ps --quiet)"
          if podman volume ls --format '{{.Name}}' | grep -E -- '-kube-.*-secret$'; then
            echo "Kube secret volumes are left after dev-down" >&2
            exit 1
          fi
          podman volume ls --format '{{.Name}}' | grep -Fx todo-postgres-data


  keycloak-pfx-spike:
    # BACKLOG X1 step 2, before any installer work: Keycloak signs a realm's
    # tokens with a key from a password-protected PFX that podman kube play
    # mounts from a Kube file secret. Its own Keycloak, in its own pod; the
    # RESULT lines in the log are the findings.
    name: Keycloak PFX spike
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Keycloak signs with a key from a PFX file secret
        run: |
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          python deploy/scripts/dev/spike_keycloak_pfx.py


  postgres-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: version
        # Read the pinned version from app_installer/settings.py instead of
        # duplicating it as a literal in the service containers below.
        run: |
          echo "version=$(PYTHONPATH=deploy/installer python3 -c \
            'from app_installer import settings; print(settings.POSTGRES_VERSION)')" >> "$GITHUB_OUTPUT"

  backend:
    needs: postgres-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ needs.postgres-version.outputs.version }}
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

      notes-postgres:
        image: postgres:${{ needs.postgres-version.outputs.version }}
        env:
          POSTGRES_DB: notes_test
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U notes -d notes_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: todo-backend/requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r todo-backend/requirements-test.txt

      - name: Test migration startup retry
        run: python -m unittest discover --start-directory todo-backend/unit_tests --verbose

      - name: Test Notes CRUD, audience isolation and migration retry
        run: python -m unittest discover --start-directory notes-backend/unit_tests --verbose

      - name: Exercise clean role setup and migrations
        shell: bash
        run: |
          set -euo pipefail
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          printf '%s' 'ci-only-not-a-secret' > "$secrets_directory/todo-db-password"
          printf '%s' 'ci-migrator-not-a-secret' > "$secrets_directory/todo-migrator-password"
          printf '%s' 'ci-app-not-a-secret' > "$secrets_directory/todo-app-password"

          export DATABASE_HOST=127.0.0.1
          export DATABASE_NAME=todo_test
          export DATABASE_BOOTSTRAP_USER=todo
          export DATABASE_SECRETS_DIRECTORY="$secrets_directory"
          python -m todo-backend.setup_roles

          export DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m todo-backend.migrate up
          unset DATABASE_URL
          python -m todo-backend.setup_roles

          (
            export DATABASE_USER=todo_app DATABASE_PASSWORD_FILE="$secrets_directory/todo-app-password"
            TODO_ROLE_TEST=1 python -m unittest discover --start-directory todo-backend/role_tests --verbose
          )

          export TEST_DATABASE_URL='host=127.0.0.1 dbname=todo_test user=todo_migrator password=ci-migrator-not-a-secret'
          python -m pytest todo-backend/tests

      - name: Exercise Notes bootstrap, migrations and runtime privileges
        shell: bash
        run: |
          set -euo pipefail
          secrets_directory=$(mktemp -d)
          trap 'rm -rf "$secrets_directory"' EXIT
          printf '%s' 'ci-only-not-a-secret' > "$secrets_directory/notes-db-password"
          printf '%s' 'ci-notes-migrator-not-a-secret' > "$secrets_directory/notes-migrator-password"
          printf '%s' 'ci-notes-app-not-a-secret' > "$secrets_directory/notes-app-password"
          export DATABASE_HOST=127.0.0.1 DATABASE_PORT=5433 DATABASE_NAME=notes_test
          export DATABASE_BOOTSTRAP_USER=notes DATABASE_SECRETS_DIRECTORY="$secrets_directory"
          python -m notes-backend.setup_roles
          export DATABASE_URL='host=127.0.0.1 port=5433 dbname=notes_test user=notes_migrator password=ci-notes-migrator-not-a-secret'
          python -m notes-backend.migrate up
          unset DATABASE_URL
          python -m notes-backend.setup_roles
          export DATABASE_USER=notes_app DATABASE_PASSWORD_FILE="$secrets_directory/notes-app-password"
          NOTES_ROLE_TEST=1 python -m unittest discover --start-directory notes-backend/tests --verbose
