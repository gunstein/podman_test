---
# Copy to ansible/secrets.yml, replace every value with a unique generated
# credential, and encrypt the file before use:
#   ansible-vault encrypt ansible/secrets.yml
todo_managed_secrets:
  todo-db-password: CHANGE_ME_unique_bootstrap_password
  todo-migrator-password: CHANGE_ME_unique_migrator_password
  todo-app-password: CHANGE_ME_unique_application_password
  todo-keycloak-db-password: CHANGE_ME_unique_keycloak_database_password
  todo-keycloak-admin-password: CHANGE_ME_unique_keycloak_admin_password
  todo-replicator-password: CHANGE_ME_32_alphanumeric_characters
