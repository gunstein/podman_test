apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-postgres-data
  annotations:
    volume.podman.io/uid: "999"
    volume.podman.io/gid: "999"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-postgres-backup
  annotations:
    volume.podman.io/uid: "999"
    volume.podman.io/gid: "999"
---
apiVersion: v1
kind: Pod
metadata:
  name: notes-postgres
  labels:
    app.kubernetes.io/name: notes
    app.kubernetes.io/component: database
  annotations:
    io.podman.annotations.pids-limit/notes-postgres: "256"
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  containers:
    - name: notes-postgres
      image: {{ .Values.postgres.image | quote }}
      imagePullPolicy: Never
      args:
        - postgres
        - -D
        - /var/lib/postgresql/data
        - -c
        - {{ printf "max_slot_wal_keep_size=%s" .Values.postgres.maxSlotWalKeepSize | quote }}
      ports:
        - name: postgres
          containerPort: 5432
      envFrom:
        - configMapRef:
            name: notes-postgres-config
            optional: false
      env:
        - name: POSTGRES_PASSWORD_FILE
          value: /run/secrets/notes-postgres/database-password
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-backup
          mountPath: /var/lib/postgresql/backup
        - name: postgres-secret
          mountPath: /run/secrets/notes-postgres
          readOnly: true
      livenessProbe:
        exec:
          command: [pg_isready, --username, notes, --dbname, notes]
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      resources:
        limits:
          memory: {{ .Values.postgres.memory | quote }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: notes-postgres-data
    - name: postgres-backup
      persistentVolumeClaim:
        claimName: notes-postgres-backup
    - name: postgres-secret
      secret:
        secretName: notes-kube-postgres-secret
        optional: false
        defaultMode: 0444
