---
- name: Inspect the current promoted primary before standby rebuild
  hosts: todo_current_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Read current primary hostname
      ansible.builtin.command: hostname
      register: rebuild_current_hostname
      changed_when: false

    - name: Read current primary IPv4 addresses
      ansible.builtin.command: {argv: [ip, -o, -4, address, show, scope, global]}
      register: rebuild_current_addresses
      changed_when: false

    - name: Validate current primary host identity
      ansible.builtin.assert:
        that:
          - rebuild_current_hostname.stdout | trim == inventory_hostname
          - todo_node_address in (rebuild_current_addresses.stdout | regex_findall('inet ([0-9.]+)/'))
        fail_msg: Current primary host identity or address does not match the inventory.

    - name: Resolve the complete registered replication group
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/read-replication-registry.yml"

    - name: Verify each registered database is ready to seed a rebuilt standby
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replicate-workload.yml"
      loop: "{{ todo_replication_metadata }}"
      loop_control:
        loop_var: todo_replication_app_meta
        label: "{{ todo_replication_app_meta.name }}"
      vars:
        todo_replication_app: "{{ todo_replication_app_meta.name }}"
        todo_replication_operation: rebuild-primary-check

- name: Inspect the fenced old primary before destructive reseed
  hosts: todo_rebuild_standby
  gather_facts: false
  any_errors_fatal: true

  vars:
    project_root: "{{ playbook_dir }}/../../.."

  tasks:
    - name: Read rebuild host hostname
      ansible.builtin.command: hostname
      register: rebuild_target_hostname
      changed_when: false

    - name: Read rebuild host IPv4 addresses
      ansible.builtin.command: {argv: [ip, -o, -4, address, show, scope, global]}
      register: rebuild_target_addresses
      changed_when: false

    - name: Validate fenced rebuild host topology and confirmations
      ansible.builtin.assert:
        that:
          - rebuild_target_hostname.stdout | trim == inventory_hostname
          - todo_node_address in (rebuild_target_addresses.stdout | regex_findall('inet ([0-9.]+)/'))
          - groups['todo_current_primary'] | length == 1
          - groups['todo_rebuild_standby'] | length == 1
          - hostvars[groups['todo_current_primary'][0]].todo_node_address != todo_node_address
          - todo_confirm_old_primary_fenced | default('') == inventory_hostname ~ ' is fenced'
          - todo_confirm_reseed | default('') == inventory_hostname
        fail_msg: >-
          Rebuild host must remain infrastructure-fenced and both exact
          confirmations are required before any destructive reseed.

    - name: Resolve the complete registered replication group
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/read-replication-registry.yml"

    - name: Require the complete infrastructure quarantine before any destructive reseed
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replicate-workload.yml"
      vars:
        todo_replication_app: "{{ todo_replication_metadata[0].name }}"
        todo_replication_operation: quarantined

    - name: Verify each registered database can be safely reseeded from the current primary
      ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replicate-workload.yml"
      loop: "{{ todo_replication_metadata }}"
      loop_control:
        loop_var: todo_replication_app_meta
        label: "{{ todo_replication_app_meta.name }}"
      vars:
        todo_replication_app: "{{ todo_replication_app_meta.name }}"
        todo_replication_operation: reseed-check
        todo_replication_primary_address: "{{ hostvars[groups['todo_current_primary'][0]].todo_node_address }}"
