apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-postgres-config
data:
  POSTGRES_DB: todo
  POSTGRES_USER: todo


---
# Source: todo/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-config
data:
  DATABASE_HOST: todo-postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: todo
  DATABASE_USER: todo_app
  LOG_LEVEL: "info"
  OIDC_ISSUER: "https://todo.test:8443/auth/realms/todo"
  OIDC_JWKS_URL: http://todo-keycloak:8080/auth/realms/todo/protocol/openid-connect/certs
  OIDC_AUDIENCE: todo-frontend


---
# Source: todo/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-keycloak-config
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_DB: postgres
  KC_DB_URL_HOST: todo-postgres
  KC_DB_URL_PORT: "5432"
  KC_DB_URL_DATABASE: todo
  KC_DB_SCHEMA: keycloak
  KC_DB_USERNAME: keycloak_app
  KC_HTTP_ENABLED: "true"
  KC_HTTP_RELATIVE_PATH: /auth
  KC_HOSTNAME: "https://todo.test:8443/auth"
  KC_PROXY_HEADERS: xforwarded
  KC_HEALTH_ENABLED: "true"
  KC_CACHE: ispn
  KC_CACHE_STACK: jdbc-ping
  KC_SPI_CACHE_EMBEDDED__DEFAULT__NODE_NAME: todo-keycloak


---
# Source: todo/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-nginx-env
data:
  TODO_TLS_HOSTNAME: "todo.test"


---
# Source: todo/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;

    events { worker_connections 1024; }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        sendfile on;
        keepalive_timeout 65;
        server_tokens off;

        upstream todo_backend { server 127.0.0.1:8000; }
        upstream todo_keycloak { server todo-keycloak:8080; }

        server {
            listen 8080;
            listen 8443 ssl;
            server_name todo.test;
            ssl_certificate /var/lib/todo-tls/server.crt;
            ssl_certificate_key /var/lib/todo-tls/server.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_session_tickets off;
            root /usr/share/nginx/html;
            index index.html;
            add_header X-Content-Type-Options nosniff always;

            location /auth/ {
                proxy_pass http://todo_keycloak;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location /api/ {
                proxy_pass http://todo_backend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location = /health {
                proxy_pass http://todo_backend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location = /ready {
                proxy_pass http://todo_backend;
                include /etc/nginx/todo-proxy-headers.conf;
            }
            location / { try_files $uri /index.html; }
        }
    }
