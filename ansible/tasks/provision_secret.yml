---
- name: "Check managed secret | {{ secret_name }}"
  ansible.builtin.command:
    argv: [podman, secret, exists, "{{ secret_name }}"]
  register: todo_managed_secret_check
  changed_when: false
  failed_when: todo_managed_secret_check.rc not in [0, 1]

- name: "Read existing managed secret | {{ secret_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - --showsecret
      - --format
      - "{{ '{{.SecretData}}' }}"
      - "{{ secret_name }}"
  register: todo_existing_managed_secret
  changed_when: false
  no_log: true
  when: todo_managed_secret_check.rc == 0

- name: "Reject managed secret mismatch | {{ secret_name }}"
  ansible.builtin.assert:
    that:
      - todo_existing_managed_secret.stdout == todo_managed_secrets[secret_name]
    fail_msg: >-
      This host already has a different value for the managed secret. Resolve
      rotation explicitly; the playbook will not overwrite it.
  when: todo_managed_secret_check.rc == 0

- name: "Create managed secret | {{ secret_name }}"
  ansible.builtin.command:
    argv: [podman, secret, create, "{{ secret_name }}", "-"]
    stdin: "{{ todo_managed_secrets[secret_name] }}"
    stdin_add_newline: false
  changed_when: true
  no_log: true
  when: todo_managed_secret_check.rc == 1
