---
- name: Require active promoted PostgreSQL
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, "{{ backup_app.postgres_service }}"]
  register: backup_postgres_service
  changed_when: false
  failed_when: backup_postgres_service.stdout | trim != "active"

- name: Require a writable promoted database
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --command
      - SELECT pg_is_in_recovery(), current_setting('transaction_read_only');
  register: backup_database_role
  changed_when: false
  failed_when: backup_database_role.stdout | trim != "f|off"

- name: Require the existing replication credential
  ansible.builtin.command:
    argv: [podman, secret, exists, "{{ backup_app.replication_secret }}"]
  changed_when: false

- name: Refresh this database's local replication authentication for base backups
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replicate-workload.yml"
  vars:
    todo_replication_app: "{{ backup_app.name }}"
    todo_replication_operation: hba

- name: Require the backup volume created by the PostgreSQL PVC
  ansible.builtin.command:
    argv: [podman, volume, exists, "{{ backup_app.backup_volume }}"]
  changed_when: false

- name: Inspect the active PostgreSQL mounts
  ansible.builtin.command:
    argv: [podman, inspect, --format, "{{ '{{json .Mounts}}' }}", "{{ backup_app.postgres_container }}"]
  register: backup_postgres_mounts
  changed_when: false

- name: Require the PVC backup volume at the archive path
  ansible.builtin.assert:
    that:
      - >-
        (backup_postgres_mounts.stdout | from_json)
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', backup_app.backup_volume)
        | selectattr('Destination', 'equalto', '/var/lib/postgresql/backup')
        | selectattr('RW', 'equalto', true) | list | length == 1
    fail_msg: The active Kube PostgreSQL workload must mount its writable backup PVC.

- name: Initialize private base-backup and WAL directories
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --user
      - postgres
      - --security-opt
      - no-new-privileges
      - --cap-drop
      - all
      - --volume
      - "{{ backup_app.backup_volume }}:/backup:U,z"
      - --entrypoint
      - /bin/sh
      - "{{ backup_app.postgres_image }}"
      - -ec
      - >-
        changed=false;
        for path in /backup /backup/base /backup/wal; do
          if [ ! -d "$path" ] || [ "$(stat -c %a "$path")" != 700 ]; then
            changed=true;
          fi;
        done;
        umask 077;
        mkdir -p /backup/base /backup/wal;
        chmod 0700 /backup /backup/base /backup/wal;
        if $changed; then echo changed; else echo unchanged; fi
  register: backup_backup_directories
  changed_when: backup_backup_directories.stdout | trim == "changed"

- name: Read the active PostgreSQL service source
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - show
      - "{{ backup_app.postgres_service }}"
      - --property=SourcePath
      - --value
  register: backup_postgres_source
  changed_when: false

- name: Require the Kube-native PostgreSQL service
  ansible.builtin.assert:
    that:
      - >-
        backup_postgres_source.stdout | trim is
        match('^.*/todo-kube-runtime/' ~ (backup_app.postgres_unit | regex_escape) ~ '$')
    fail_msg: Backup configuration refuses to replace a non-Kube PostgreSQL runtime.

- name: Read current archive settings
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --field-separator=|
      - --command
      - >-
        SELECT current_setting('archive_mode'),
        current_setting('archive_command'),
        current_setting('archive_timeout');
  register: backup_archive_settings
  changed_when: false

- name: Configure continuous WAL archiving
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --set
      - ON_ERROR_STOP=1
      - --command
      - ALTER SYSTEM SET archive_mode = 'on';
      - --command
      - "ALTER SYSTEM SET archive_command = '{{ backup_archive_command }}';"
      - --command
      - "ALTER SYSTEM SET archive_timeout = '{{ backup_archive_timeout }}';"
  register: backup_archive_configured
  changed_when: true
  when: >-
    backup_archive_settings.stdout | trim !=
    "on|" ~ backup_archive_command ~ "|" ~ backup_archive_timeout

- name: Stop the application tier before PostgreSQL restart
  ansible.builtin.command:
    argv: [systemctl, --user, stop, "{{ item }}"]
  loop: "{{ backup_application_services }}"
  changed_when: false
  register: backup_service_stopped
  failed_when: backup_service_stopped.rc not in [0, 5]
  when: backup_archive_configured.changed | default(false)

- name: Reload user systemd after PostgreSQL changes
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true

- name: Restart PostgreSQL with WAL archiving
  ansible.builtin.systemd_service:
    name: "{{ backup_app.postgres_service }}"
    scope: user
    state: restarted
  when: backup_archive_configured.changed | default(false)

- name: Wait for healthy PostgreSQL
  ansible.builtin.command:
    argv: [podman, wait, --condition=healthy, "{{ backup_app.postgres_container }}"]
  changed_when: false

- name: Recheck promoted database role and archive settings
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --field-separator=|
      - --command
      - >-
        SELECT pg_is_in_recovery(),
        current_setting('transaction_read_only'),
        current_setting('archive_mode'),
        current_setting('archive_command'),
        current_setting('archive_timeout');
  register: backup_archive_verified
  changed_when: false
  failed_when: >-
    backup_archive_verified.stdout | trim !=
    "f|off|on|" ~ backup_archive_command ~ "|" ~ backup_archive_timeout

- name: Start the application tier after PostgreSQL restart
  ansible.builtin.systemd_service:
    name: shared-proxy.service
    scope: user
    state: started

- name: Wait for application readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/ready
    headers:
      Host: "{{ backup_app.hostname }}"
    return_content: true
  register: backup_readiness
  until: backup_readiness.status == 200 and backup_readiness.json.status == "ready"
  retries: 30
  delay: 1
  when: backup_app.hostname is defined

- name: Wait for Keycloak discovery
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/auth/realms/todo/.well-known/openid-configuration
    return_content: true
  register: backup_discovery
  until: backup_discovery.status == 200
  retries: 90
  delay: 2

- name: Decide whether WAL archive verification is required
  ansible.builtin.set_fact:
    backup_archive_verification_required: >-
      {{
        backup_backup_directories.changed or
        backup_archive_configured.changed | default(false)
      }}
  changed_when: false

- name: Generate a WAL record for the archive verification
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --set
      - ON_ERROR_STOP=1
      - --command
      - "SELECT pg_create_restore_point('{{ backup_app.archive_check_prefix }}_' || to_char(clock_timestamp(), 'YYYYMMDDHH24MISSUS'));"
  changed_when: false
  when: backup_archive_verification_required

- name: Read the current WAL segment name
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --command
      - SELECT pg_walfile_name(pg_current_wal_lsn());
  register: backup_wal_before_switch
  changed_when: false
  when: backup_archive_verification_required

- name: Force a WAL segment switch
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --command
      - SELECT pg_switch_wal();
  changed_when: false
  when: backup_archive_verification_required

- name: Wait for the exact switched WAL segment in the archive
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - test
      - -f
      - "/var/lib/postgresql/backup/wal/{{ backup_wal_before_switch.stdout | trim }}"
  register: backup_archived_wal_file
  changed_when: false
  retries: 30
  delay: 1
  until: backup_archived_wal_file.rc == 0
  when: backup_archive_verification_required

- name: Read PostgreSQL archiver diagnostics
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ backup_app.postgres_container }}"
      - psql
      - --username
      - "{{ backup_app.name }}"
      - --dbname
      - postgres
      - --tuples-only
      - --no-align
      - --field-separator=|
      - --command
      - "SELECT COALESCE(last_archived_wal, ''), COALESCE(last_failed_wal, '') FROM pg_stat_archiver;"
  register: backup_archiver_status
  changed_when: false
  when: backup_archive_verification_required

- name: Report healthy continuous archiving
  ansible.builtin.debug:
    msg: >-
      WAL archiving is active. Segment {{ backup_wal_before_switch.stdout | trim }}
      was copied to the separate {{ backup_app.backup_volume }} volume.
  when: backup_archive_verification_required
