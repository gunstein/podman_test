---
# Controller-to-target transport: the trusted installer plus every registered
# database's Quadlet templates and canonical YAML, staged once for group commands.
- name: Read the complete database group and stage the trusted installer
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/read-replication-registry.yml"

- name: Stage canonical Quadlet templates for every registered database
  ansible.builtin.copy:
    src: "{{ project_root }}/deploy/quadlet/{{ item }}"
    dest: "{{ app_installer_target }}/deploy/quadlet/{{ item }}"
    mode: "0600"
  loop: "{{ todo_replication_metadata | map(attribute='templates') | flatten | unique }}"

- name: Stage the canonical database and ConfigMap YAML for every registered database
  ansible.builtin.copy:
    src: "{{ todo_rendered_manifest_directory }}/{{ item }}"
    dest: "{{ app_installer_target }}/generated/kube-runtime/{{ item }}"
    mode: "0600"
  loop: "{{ todo_replication_metadata | map(attribute='manifests') | map(attribute='postgres') | flatten | unique }}"
