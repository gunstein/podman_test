---
# Transport only: deploy/scripts/trust-files.sh owns exact-file trust. It runs
# through the RPM-trusted shell, since the files it trusts are the project's
# own code. Its text travels in argv, so nothing is written to ~/.ansible/tmp.
- name: Require active fapolicyd on the target before installing anything
  ansible.builtin.command:
    argv: [systemctl, is-active, fapolicyd]
  register: todo_fapolicyd_service
  changed_when: false
  failed_when: todo_fapolicyd_service.stdout | trim != "active"

- name: Read the exact-file trust script
  ansible.builtin.set_fact:
    todo_fapolicyd_script: "{{ lookup('ansible.builtin.file', project_root ~ '/deploy/scripts/trust-files.sh') }}"

- name: Refresh and wait for exact source-file trust on the Ansible controller
  ansible.builtin.command:
    argv: >-
      {{ ['/bin/sh', '-c', todo_fapolicyd_script, 'trust-files', 'trust', todo_fapolicyd_trust_file]
         + (todo_fapolicyd_files | map(attribute='source') | list) }}
  delegate_to: localhost
  become: true
  register: todo_fapolicyd_sources
  changed_when: todo_fapolicyd_sources.stdout | trim == "changed"

- name: Create the Todo operator binary directory
  ansible.builtin.file:
    path: "{{ todo_fapolicyd_install_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install exact Todo operator files through trusted stdin
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - "{{ todo_fapolicyd_script }}"
      - trust-files
      - install
      - "{{ item.dest }}"
      - "{{ item.mode | default('0644') }}"
    stdin: "{{ lookup('ansible.builtin.file', item.source, rstrip=false) | b64encode }}"
    stdin_add_newline: false
  loop: "{{ todo_fapolicyd_files }}"
  loop_control:
    label: "{{ item.dest }}"
  become: true
  register: todo_fapolicyd_installed
  changed_when: todo_fapolicyd_installed.stdout | trim == "changed"

- name: Refresh and wait for exact installed file trust on the target
  ansible.builtin.command:
    argv: >-
      {{ ['/bin/sh', '-c', todo_fapolicyd_script, 'trust-files', 'trust', todo_fapolicyd_trust_file]
         + (todo_fapolicyd_files | map(attribute='dest') | list) }}
  become: true
  register: todo_fapolicyd_targets
  changed_when: todo_fapolicyd_targets.stdout | trim == "changed"
