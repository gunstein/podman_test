---
- name: Inspect both initial database hosts before changing runtime state
  hosts: todo_cluster
  # The shared trust role also updates exact controller file trust. Serialize it.
  serial: 1
  gather_facts: false
  any_errors_fatal: true

  roles:
    - role: standby_preflight

- name: Validate the primary and standby relationship
  hosts: todo_primary
  gather_facts: false
  any_errors_fatal: true

  vars:
    primary_host: "{{ groups['todo_primary'][0] }}"
    standby_host: "{{ groups['todo_standby'][0] }}"
    preflight_require_empty_standby: true

  tasks:
    - name: Require exactly one primary and one standby
      ansible.builtin.assert:
        that:
          - groups['todo_primary'] | length == 1
          - groups['todo_standby'] | length == 1
        fail_msg: This standby demo requires exactly one primary and one standby.

    - name: Require unique hostnames, machine IDs and addresses
      ansible.builtin.assert:
        that:
          - primary_host != standby_host
          - hostvars[primary_host].todo_node_role == 'primary'
          - hostvars[standby_host].todo_node_role == 'standby'
          - hostvars[primary_host].preflight_machine_id.stdout != hostvars[standby_host].preflight_machine_id.stdout
          - hostvars[primary_host].todo_node_address != hostvars[standby_host].todo_node_address
        fail_msg: Primary and standby must have unique identities and addresses.

    - name: Require existing primary database data
      ansible.builtin.assert:
        that:
          - hostvars[primary_host].preflight_postgres_volume.results | map(attribute='rc') | reject('equalto', 0) | list | length == 0
        fail_msg: Every registered primary database must already have its data volume.

    - name: Require an empty standby before initial base backup
      ansible.builtin.assert:
        that:
          - hostvars[standby_host].preflight_postgres_volume.results | map(attribute='rc') | reject('equalto', 1) | list | length == 0
        fail_msg: >-
          Standby already has a registered database data volume. The preflight will
          not overwrite it. Inspect or remove it explicitly before bootstrap.
      when: preflight_require_empty_standby | bool

    - name: Report successful standby preflight
      ansible.builtin.debug:
        msg: >-
          Standby preflight passed for {{ primary_host }}
          ({{ hostvars[primary_host].todo_node_address }}) and {{ standby_host }}
          ({{ hostvars[standby_host].todo_node_address }}). No runtime or database state was changed; the exact registry implementation was staged.
