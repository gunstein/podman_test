---
- name: Resolve the complete database group before archive configuration
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/read-replication-registry.yml"

- name: Require completed promotion for the entire writable group
  ansible.builtin.command:
    argv: [python3, -m, todo_installer, require-promoted-group, --journal, "{{ backup_config_directory }}/promotion.json"]
  environment:
    PYTHONPATH: "{{ '/opt/todo/lib' if todo_installer_fapolicyd.rc == 0 else todo_installer_target ~ '/deploy/installer' }}"
    PYTHONDONTWRITEBYTECODE: "1"
  changed_when: false

- name: Select the shared application tier for database restarts
  ansible.builtin.set_fact:
    backup_application_services: >-
      {{ ['shared-proxy.service'] + (todo_replication_metadata | map(attribute='application_service') | list)
         + ['keycloak.service'] }}

- name: Configure an independent archive for each database
  ansible.builtin.include_tasks: database.yml
  loop: "{{ todo_replication_metadata }}"
  loop_control:
    loop_var: backup_app
    label: "{{ backup_app.name }}"

- name: Install and trust the backup and PITR tool
  ansible.builtin.include_role:
    name: todo_fapolicyd
  vars:
    todo_fapolicyd_files:
      - source: "{{ project_root }}/deploy/scripts/todo_backup.py"
        dest: /opt/todo/bin/todo_backup.py
        mode: "0644"
