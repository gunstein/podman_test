# The app developer's file: what the Notes app is (docs/PLATFORM-PLAN.md,
# section 5.1). It never names other apps or installation choices; those are
# in the operator's platform.yaml. The source is still in notes-backend/ and
# notes-frontend/ at the repository root; phase 5 moves it here.

name: notes
# Its own PostgreSQL database, replicated for DR (platform.yaml gives the
# replicationPort). Without database: true the platform makes none.
database: true
# The OAuth client its frontend logs in with at the shared Keycloak
# (notes-frontend/keycloak-adapter.js). Without keycloakClient the app has no
# login; Keycloak runs only when some app has one.
keycloakClient: notes-frontend
# apiCollection is left out: the DR tools check the app by reading /api/notes,
# the name (see examples/todo/app.yaml).
# The images it builds (section 5.2), each localhost/notes-<name>; see
# examples/todo/app.yaml.
images:
  backend:
    context: ../..
    containerfile: notes-backend/Containerfile
  frontend:
    context: ../..
    containerfile: notes-frontend/Containerfile
# The ports in its pod that nginx sends requests to (section 5.3).
endpoints:
  frontend:
    port: 8080
  backend:
    port: 8000
# The paths on its own hostname and the endpoint each goes to: a prefix path
# ends with a slash, exact: true matches the whole path. /auth/ is the
# platform's (Keycloak) on every app's hostname.
routes:
  - path: /api/
    to: backend
  - path: /health
    exact: true
    to: backend
  - path: /ready
    exact: true
    to: backend
  - path: /
    to: frontend
