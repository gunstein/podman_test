---
- name: Resolve the registered replication group
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replication-apps.yml"

- name: Bootstrap each registered standby through the shared bridge
  ansible.builtin.include_tasks: "{{ project_root }}/deploy/ansible/tasks/replicate-workload.yml"
  loop: "{{ apps_to_replicate }}"
  loop_control:
    loop_var: todo_replication_app
  vars:
    todo_replication_operation: standby
    todo_replication_primary_address: "{{ hostvars[groups['todo_primary'][0]].todo_node_address }}"
    todo_replication_image_archive: "{{ standby_postgres_image_archive }}"
